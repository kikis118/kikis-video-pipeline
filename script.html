<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Scripts</title>
<!-- Viewer for scripts published by the shorts tool's Video Studio
     (kikis-shorts-tool app/studio/store.py → scripts/<slug>.json + scripts/index.json).
     No list → script.html; one script → script.html?s=<slug>. Talking points only:
     sources, b-roll and editor notes never leave the editor's PC.

     NOTES / FIXES from Ghazzy live in Firestore config/scriptnotes-<slug>, never in the
     script JSON - a re-publish rewrites scripts/<slug>.json but can't touch them. Each note
     stores the bullet text it was made on (`quote`); if that bullet changes in a later
     publish the note stays, shown at the end of its section with the original wording. -->
<style>
:root{--bg:#0f1117;--panel:#171a23;--card:#1d2130;--border:#2a3042;--text:#e8eaf0;--muted:#8b93a7;--accent:#7aa2ff;--take:#2a2414;--take-b:#6b5726;--take-t:#f0c96a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:14px}
.top a{text-decoration:none}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}
.meta{color:var(--muted);font-size:14px;margin-bottom:22px}
.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
button,select,textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent)}
details.sec{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin:10px 0;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:baseline}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted);width:12px;flex:none}
details.sec[open]>summary::before{content:"▾"}
.num{color:var(--accent);font-weight:700;flex:none}
.stitle{font-weight:650;font-size:18px;flex:1}
.mins{color:var(--muted);font-size:13px;flex:none}
.sub{color:var(--muted);font-size:14px;font-style:italic;margin:-6px 0 6px 38px}
.body{padding:0 18px 14px 38px}
.body ul{margin:6px 0;padding-left:20px}.body li{margin:5px 0;position:relative}
.take{background:var(--take);border:1px solid var(--take-b);border-radius:8px;padding:8px 14px;margin:10px 0}
.take b{color:var(--take-t);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
details.more{margin-top:8px;color:var(--muted)}
details.more summary{cursor:pointer;font-size:13px}
.list a.item{display:block;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:10px 0;text-decoration:none;color:var(--text)}
.list a.item:hover{border-color:var(--accent)}
.list .t{font-weight:650;font-size:17px}.list .d{color:var(--muted);font-size:13px}
.empty{color:var(--muted)}

/* Talking-point formatting - same rules as the shorts tool's Video Studio (studio.js lineKind/fmtInline).
   Pros/cons/key points are subtle tinted boxes, in the same spirit as the "Your take" box. */
/* Faint, in-flow tints - readable first. "Your take" keeps its box. */
li.fmt-pro{color:#cfe8d7}li.fmt-pro::marker{color:#5fbf86}
li.fmt-con{color:#efd2d1}li.fmt-con::marker{color:#d9736e}
li.fmt-pro b.lbl{color:#8fd3aa;font-weight:600}li.fmt-con b.lbl{color:#e8a3a0;font-weight:600}
li.fmt-key{color:#f2e3bd}li.fmt-key b.lbl{color:#e8c46a;font-weight:600}
li.fmt-quote{font-style:italic;color:#b9bfcc;border-left:2px solid #4a5068;padding-left:10px;list-style:none;margin-left:-12px}
li.fmt-img{list-style:none;margin-left:-20px}
a.shot{display:block;margin:6px 0;color:var(--muted);text-decoration:none;font-size:13px}
a.shot img{display:block;max-width:100%;max-height:520px;border-radius:8px;border:1px solid var(--border);margin-bottom:4px}
a.shot:hover img{border-color:var(--accent)}
.body li a:not(.shot){color:var(--accent)}
/* PoE 2 tooltips on hover - same look as the shorts tool's Video Studio */
.tt { text-decoration: underline dotted #b08a4a; text-underline-offset: 3px; cursor: help; }
.tt-pop { display: none; position: fixed; z-index: 9999; width: 360px; background: #000000f2; border: 1px solid #5b4b2e; border-radius: 4px;
  font-family: 'Palatino Linotype', Georgia, serif; font-size: 13.5px; text-align: center; color: #9a9a9a; box-shadow: 0 10px 30px #000c; pointer-events: none; }
.tt-h { padding: 5px 10px; border-bottom: 1px solid #5b4b2e; background: linear-gradient(#3a2a12, #1c140a); color: var(--c); font-size: 16px; }
.tt-h .tt-b { font-size: 14px; } .tt-c { padding: 6px 12px 8px; line-height: 1.35; }
.tt-c img { max-height: 90px; margin-top: 6px; }
.tt-sep { height: 1px; margin: 5px 14px; background: linear-gradient(90deg, #0000, #5b4b2e, #0000); }
.tt-implicitMod, .tt-explicitMod, .tt-runeMod, .tt-enchantMod, .tt-gemDescr { color: #8888ff; } .tt-craftedMod { color: #b4b4ff; }
.tt-flavourText { color: #af6025; font-style: italic; } .tt-corrupted { color: #d20000; } .tt-secDescrText, .tt-descrText { color: #9a9a9a; }
/* CURRENT | NEW in 1.0 tooltip pair - same as the shorts tool's Video Studio */
.tt.tt-n { text-decoration-color: #6fd3ff; }
.tt.tt-n::after { content: '✦'; font-size: .65em; color: #6fd3ff; vertical-align: super; margin-left: 1px; }
.tt-pop.wide { width: min(780px, 96vw); background: transparent; border: 0; box-shadow: none; }
.tt-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
.tt-col { background: #000000f2; border: 1px solid #5b4b2e; border-radius: 4px; box-shadow: 0 10px 30px #000c; overflow: hidden; }
.tt-col:last-child { border-color: #2f6f8a; }
.tt-lab { font: 600 11px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: 5px 0; color: #b9a27a; background: #120d06; }
.tt-lab.tt-labnew { color: #7fe0ff; background: #06141a; }
.tt-hnew { background: linear-gradient(#123240, #0a1a22); border-bottom-color: #2f6f8a; color: #bfefff; }
.tt-new { text-align: left; color: #c9c9c9; }
.tt-sum { color: #e6e6e6; margin-bottom: 4px; }
.tt-ch { margin: 4px 0 6px 16px; padding: 0; color: #9fe6b0; } .tt-ch li { margin: 2px 0; }
.tt-shot { display: block; width: 100%; max-height: 260px; object-fit: contain; margin: 6px 0 2px; border: 1px solid #2f6f8a33; }
.tt-nl { color: #8888ff; text-align: center; }
.tt-src { font: 11px system-ui, sans-serif; color: #6c8a96; margin-top: 6px; }
.tt-none { color: #777; font-style: italic; }
@media (max-width: 640px) { .tt-pair { grid-template-columns: 1fr; } }
.tt-pop.wide { max-height: calc(100vh - 16px); overflow: hidden; }
@media (max-width: 640px), (max-height: 700px) { .tt-shot { max-height: 150px; } .tt-ch li { margin: 1px 0; } }
mark{background:#6b5726;color:#fff;padding:0 3px;border-radius:2px}

/* Editing + notes: double-click a line. No buttons in the reading view. */
.can-note li[data-key]{cursor:text;border-radius:4px;transition:background .15s}
.can-note li[data-key]:hover{background:#ffffff08}
li.was-edited{text-decoration:underline dotted #59607a;text-underline-offset:4px;text-decoration-thickness:1px}
li.editing{list-style:none;margin-left:-20px}
.editbox textarea{width:100%;min-height:58px;background:#11141c;color:var(--text);border:1px solid #3a4260;border-radius:6px;padding:7px 9px;font:inherit;font-size:15px;line-height:1.5;resize:vertical;cursor:text}
.editbox .erow{font-size:12.5px;color:var(--muted);margin:3px 0 8px}
.editbox .erow a{color:var(--muted);text-decoration:none;cursor:pointer}.editbox .erow a:hover{color:var(--text)}
.editbox .erow a.go{color:var(--accent)}
.nline{font-size:13px;color:#a7aec0;font-style:italic;margin:2px 0 4px;list-style:none}
.nline b{font-style:normal;color:#c9cfdc;font-weight:600}
.nline .rs{visibility:hidden;margin-left:6px;color:var(--muted);cursor:pointer;font-style:normal}
.nline:hover .rs{visibility:visible}
.nline.resolved{opacity:.45;text-decoration:line-through}
.hint{color:var(--muted);font-size:13px;margin:-14px 0 18px}
.hint button{padding:2px 9px;font-size:12px}
.hide-resolved .nline.resolved{display:none}
details.ideas{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin:4px 0 22px}
details.ideas>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;color:#c9cfdc}
details.ideas>summary::-webkit-details-marker{display:none}
details.ideas>summary::before{content:"▸ ";color:var(--muted)}details.ideas[open]>summary::before{content:"▾ "}
details.ideas .inner{padding:0 14px 12px}
details.ideas .idea{background:var(--card)}
h2.lh{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:26px 0 8px}
.idea,.sitem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin:8px 0}
.idea .it{font-weight:600;flex:1;min-width:200px}.idea .in{flex-basis:100%;color:var(--muted);font-size:13px;white-space:pre-wrap;margin-top:-4px}
.idea .fast{color:#ff9d98;font-size:12px;font-weight:700}.idea .cl{color:var(--muted);font-size:12px}
.sitem a.t{font-weight:650;font-size:17px;color:var(--text);text-decoration:none;flex:1;min-width:200px}.sitem a.t:hover{color:var(--accent)}
.sitem .d{flex-basis:100%;color:var(--muted);font-size:13px;margin-top:-6px}
.sitem[data-href]{cursor:pointer;transition:border-color .15s,background .15s}.sitem[data-href]:hover{border-color:var(--accent)}
.sitem.rec{border-color:#2f6b47;background:#141f19}.sitem.rec a.t{color:#9aa3b5;text-decoration:line-through;text-decoration-color:#4fc47f}
.recbtn{display:inline-flex;gap:7px;align-items:center;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid #3a4260;background:#1a1f2d;color:#c9cfdc;cursor:pointer;white-space:nowrap}
.recbtn:hover{border-color:#4fc47f;color:#dff5e7}
.recbtn.on{background:#1c4a2d;border-color:#3fbf72;color:#c9ffdc}
.recbtn .bx{width:18px;height:18px;border-radius:5px;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.recbtn.on .bx{background:#2fa760;border-color:#2fa760;color:#fff}
.reccheck{color:#fff;background:#2fa760;font-size:15px;font-weight:800;width:24px;height:24px;line-height:24px;border-radius:50%;text-align:center;flex:none;box-shadow:0 0 10px #2fa76066}
.sitem .reccheck.off{background:none;box-shadow:none;border:2px solid #3a4260;color:transparent;width:24px;height:24px;line-height:20px}
.ed{border:none;background:none;padding:2px 6px;opacity:.5;font-size:14px}.ed:hover{opacity:1}
body:not(.can-edit) .ed,body:not(.can-edit) .recbtn,body:not(.can-edit) .addidea{display:none}
.addidea{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}.addidea input{flex:1;min-width:180px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font:inherit;font-size:14px}
.h1row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.h1row h1{margin:0}
.recline{margin:4px 0 18px}
@media print{body{background:#fff;color:#000}.controls,.top,.notebar,.hint,.recline{display:none}details.sec{border-color:#ccc;background:#fff}.take{background:#fff8e6}
  li.fmt-pro{background:#eefaf2;color:#0a5a2a}li.fmt-con{background:#fdeeee;color:#8a1f1a}li.fmt-key{background:#fff3c4;color:#000}mark{background:#fff3c4;color:#000}}
</style>

<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = document.getElementById('app');
// + green (pro), - red (con), ! amber key point, > quote, **bold**, ==highlight==
function lineKind(t) {
  t = String(t || '').trimStart();
  if (/^\+/.test(t)) return 'fmt-pro';
  if (/^[-−–]/.test(t)) return 'fmt-con';
  if (/^!\[/.test(t)) return 'fmt-img';
  if (/^!/.test(t)) return 'fmt-key';
  if (/^>/.test(t)) return 'fmt-quote';
  return '';
}
function fmt(t) {
  const k = lineKind(t);
  let h = esc(String(t).trimStart());
  if (k && k !== 'fmt-img') h = h.replace(/^(\+|-|−|–|!|&gt;)\s*/, '');
  // "+ Common praise: ..." -> the label before the colon goes bold
  if (k === 'fmt-pro' || k === 'fmt-con' || k === 'fmt-key') h = h.replace(/^([^:]{2,40}):/, '<b class="lbl">$1:</b>');
  return links(tooltips(h)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/==(.+?)==/g, '<mark>$1</mark>');
}
// ![caption](scripts/img/...) screenshots, [text](https://...) links, bare https:// links.
// Only http(s) and our own scripts/img/ paths are allowed - nothing else becomes a link/image.
// Exact PoE 2 tooltips embedded by Publish (sc.tooltips, from the Studio's poe2db database):
// [[Name]] / [[shown words|Name]] tags and exact names become hoverable (tap on phones).
let TTRX = null, NTRX = null, NTCANON = {};
// names with a 'NEW in 1.0' side (sc.newtips, from the ExileCon keynote) get a small blue star
function ttCls(n) { return 'tt' + (SC && SC.newtips && SC.newtips[String(n).replace(/&#39;/g, "'")] ? ' tt-n' : ''); }
function tooltips(h) {
  const tips = (SC && SC.tooltips) || {};
  const held = [];
  h = h.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => { held.push(tips[(b || a).replace(/&#39;/g, "'")] ? `<span class="${ttCls(b || a)}" data-tt="${b || a}">${a}</span>` : a); return `\u0001${held.length - 1}\u0002`; });
  if (TTRX === null) {
    const names = Object.keys(tips).filter((n) => n.length >= 5).sort((a, b) => b.length - a.length);
    TTRX = names.length ? new RegExp(`(?<![\\w'&#;])(${names.map((n) => esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})(?![\\w'])`, 'g') : false;
  }
  if (NTRX === null) {
    const terms = Object.keys((SC && SC.newtips) || {}).filter((n) => n.length >= 5).sort((a, b) => b.length - a.length);
    NTCANON = Object.fromEntries(terms.map((t) => [t.toLowerCase(), t]));
    NTRX = terms.length ? new RegExp(`(?<![\\w'&#;])(${terms.map((n) => esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})(?![\\w'])`, 'gi') : false;
  }
  if (NTRX) h = h.split(/(<[^>]+>)/).map((part) => (part.startsWith('<') ? part : part.replace(NTRX, (m) => { const c = NTCANON[m.toLowerCase()] || m; held.push(`<span class="${ttCls(c)}" data-tt="${c}">${m}</span>`); return `\u0001${held.length - 1}\u0002`; }))).join('');
  if (TTRX) h = h.split(/(<[^>]+>)/).map((part) => (part.startsWith('<') ? part : part.replace(TTRX, (m) => { held.push(`<span class="${ttCls(m)}" data-tt="${m}">${m}</span>`); return `\u0001${held.length - 1}\u0002`; }))).join('');
  return h.replace(/\u0001(\d+)\u0002/g, (m, i) => held[+i]);
}
function tooltipHtml(t) {
  const col = { Unique: '#af6025', Rare: '#ffff77', Magic: '#8888ff', Gem: '#1ba29b', Currency: '#aa9e82' }[t.rarity] || '#c8c8c8';
  let prev = null, body = '';
  (t.lines || []).slice(0, 18).forEach((l) => {
    const g = l.cls === 'property' ? 'p' : l.cls;
    if (prev !== null && g !== prev) body += '<div class="tt-sep"></div>';
    prev = g;
    body += `<div class="tt-${esc(l.cls)}">${esc(l.text).replace(/\n/g, '<br>')}</div>`;
  });
  if ((t.lines || []).length > 18) body += '<div class="tt-property">…</div>';
  return `<div class="tt-h" style="--c:${col}"><div>${esc(t.name)}</div>${t.base ? `<div class="tt-b">${esc(t.base)}</div>` : ''}</div><div class="tt-c">${body}${t.icon ? `<img src="${esc(t.icon)}">` : ''}</div>`;
}
const ttPop = document.createElement('div');
ttPop.className = 'tt-pop'; document.body.appendChild(ttPop);
// CURRENT | NEW in 1.0 popup. The NEW side comes from the ExileCon keynote (newtips.py): summary,
// concrete changes, and the exact keynote screenshot of the tooltip (or its read text when no shot).
function newSideHtml(n, imgSrc) {
  const ch = (n.changes || []).map((c) => `<li>${esc(c)}</li>`).join('');
  const lines = !imgSrc ? (n.lines || []).slice(0, 16).map((l) => `<div class="tt-nl">${esc(l)}</div>`).join('') : '';
  const src = (n.sources || []).slice(0, 3).map((x) => esc(x.ts)).join(' · ');
  return `<div class="tt-h tt-hnew"><div>${esc(n.term)}</div><div class="tt-b">ExileCon 2026 keynote</div></div><div class="tt-c tt-new">`
    + `${n.summary ? `<div class="tt-sum">${esc(n.summary)}</div>` : ''}${ch ? `<ul class="tt-ch">${ch}</ul>` : ''}`
    + `${imgSrc ? `<img class="tt-shot" src="${esc(imgSrc)}" alt="">` : ''}${lines ? `<div class="tt-sep"></div>${lines}` : ''}`
    + `${src ? `<div class="tt-src">keynote @ ${src}</div>` : ''}</div>`;
}
function tipPairHtml(t, n, imgSrc) {
  if (!n) return tooltipHtml(t);
  const cur = t && !t.missing && (t.lines || []).length ? tooltipHtml(t)
    : `<div class="tt-h" style="--c:#c8c8c8"><div>${esc(n.term)}</div><div class="tt-b">Not in the game yet</div></div><div class="tt-c tt-none">New in 1.0 - nothing to compare with in the current patch.</div>`;
  return `<div class="tt-pair"><div class="tt-col"><div class="tt-lab">Current</div>${cur}</div><div class="tt-col"><div class="tt-lab tt-labnew">✨ New in 1.0</div>${newSideHtml(n, imgSrc)}</div></div>`;
}
function showTip(el) {
  const name = el.dataset.tt.replace(/&#39;/g, "'");
  const t = SC && SC.tooltips && SC.tooltips[name];
  const n = SC && SC.newtips && SC.newtips[name];
  if (!t && !n) return;
  ttPop.innerHTML = tipPairHtml(t, n, n && n.image ? n.image : '');
  ttPop.classList.toggle('wide', !!n);
  ttPop.style.display = 'block';
  const r = el.getBoundingClientRect();
  ttPop.style.left = Math.min(innerWidth - ttPop.offsetWidth - 8, Math.max(8, r.left)) + 'px';
  ttPop.style.top = (r.bottom + 8 + ttPop.offsetHeight > innerHeight ? Math.max(8, r.top - ttPop.offsetHeight - 8) : r.bottom + 8) + 'px';
}
document.addEventListener('mouseover', (e) => { const el = e.target.closest && e.target.closest('.tt[data-tt]'); if (el) showTip(el); else ttPop.style.display = 'none'; });
document.addEventListener('click', (e) => { const el = e.target.closest && e.target.closest('.tt[data-tt]'); if (el) { showTip(el); if (el.closest('summary')) e.preventDefault(); } else ttPop.style.display = 'none'; });
document.addEventListener('scroll', () => { ttPop.style.display = 'none'; }, true);
function links(h) {
  return h
    .replace(/!\[([^\]]*)\]\(((?:scripts\/img\/|https?:\/\/)[^)\s]+)\)/g, (m, cap, u) => `<a class="shot" href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="" loading="lazy"><span>${cap}</span></a>`)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
const slug = new URLSearchParams(location.search).get('s');
let SC = null;        // the published script
let NOTES = [];       // notes from Firestore (window.notesApi)

async function getJson(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status === 404 ? 'not found' : 'HTTP ' + r.status);
  return r.json();
}

// Shared state from the Firestore module below (window.notesApi):
//   status  config/script-status {scripts:{slug:{title?, recorded, recordedBy, recordedAt}}} - title
//           overrides + "Script recorded" ticks, kept OUT of the published JSON so Publish can't undo them
//   ideas   pipeline rows with status 'Idea' (the board's to-do videos), list page only
let INDEX = null;
let IDEAS_OPEN = false;   // ideas dropdown state survives live re-renders
const nice = (d) => { const t = new Date(String(d).replace(' ', 'T')); return isNaN(t) ? d : t.toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
const statusOf = (sl) => ((window.notesApi && window.notesApi.status) || {})[sl] || {};
const titleOf = (sl, fallback) => statusOf(sl).title || fallback;
function signBar(what) {
  const api = window.notesApi;
  if (!api || api.state === 'loading') return `<div class="notebar">Connecting…</div>`;
  if (api.state === 'signedout') return `<div class="notebar">${what} <button data-signin>Sign in with Google</button></div>`;
  if (api.state === 'denied') return `<div class="notebar">Your Google account isn't on the allowlist - ask Kikis.</div>`;
  if (api.state === 'error') return `<div class="notebar">Can't reach the board right now (offline?) - showing published scripts only.</div>`;
  return '';
}

async function showList() {
  document.title = 'Video Scripts';
  const dd = document.querySelector('details.ideas'); if (dd) IDEAS_OPEN = dd.open;
  if (!INDEX) { try { INDEX = await getJson('scripts/index.json'); } catch (e) { INDEX = []; } }
  const api = window.notesApi || {};
  const ideas = (api.ideas || []).slice().sort((a, b) => (b.doFast ? 1 : 0) - (a.doFast ? 1 : 0) || (a.order ?? 1e9) - (b.order ?? 1e9) || (a.createdAtMs || 0) - (b.createdAtMs || 0));
  const scripts = INDEX.map((x) => Object.assign({}, x, { st: statusOf(x.slug) })).sort((a, b) => (a.st.recorded ? 1 : 0) - (b.st.recorded ? 1 : 0) || String(b.updated).localeCompare(String(a.updated)));
  const ideasHtml = api.state !== 'ready' ? '<div class="empty">Sign in to see the list of ideas.</div>'
    : (ideas.map((r) => {
        const cl = Array.isArray(r.checklist) ? r.checklist : null;
        return `<div class="idea"><span class="it">${r.doFast ? '<span class="fast">★ DO FAST</span> ' : ''}${esc(r.title)}</span>
          ${cl ? `<span class="cl">☑ ${cl.filter((i) => i.done).length}/${cl.length}</span>` : ''}
          ${r.scriptSlug ? `<a href="?s=${encodeURIComponent(r.scriptSlug)}">📄 Script</a>` : ''}
          <button class="ed" data-rename-idea="${esc(r.id)}" title="Rename">✎</button>
          ${r.notes ? `<div class="in">${esc(r.notes.length > 220 ? r.notes.slice(0, 220) + '…' : r.notes)}</div>` : ''}</div>`;
      }).join('') || '<div class="empty">No ideas yet.</div>');
  app.innerHTML = `<div class="top"><a href="./">← Pipeline board</a></div><h1>Video scripts</h1>
    <div class="meta">Talking-point scripts for upcoming videos - newest first.</div>
    ${signBar('Sign in to see the ideas list and tick off recorded scripts.')}
    <details class="ideas" ${IDEAS_OPEN ? 'open' : ''}><summary>💡 List of ideas${api.state === 'ready' ? ` (${ideas.length})` : ''}</summary><div class="inner">
    <div class="addidea"><input id="newIdea" placeholder="New video idea…"><input id="newIdeaNotes" placeholder="Notes (optional)"><button data-addidea>+ Add idea</button></div>
    ${ideasHtml}
    ${api.state === 'ready' ? '<div style="margin-top:6px;font-size:13px"><a href="./?view=todo">Checklists, Do Fast and deleting ideas → board to-do page</a></div>' : ''}
    </div></details>
    <h2 class="lh">📝 Video scripts</h2>
    ${scripts.map((x) => `<div class="sitem ${x.st.recorded ? 'rec' : ''}" data-href="?s=${encodeURIComponent(x.slug)}"><span class="reccheck ${x.st.recorded ? '' : 'off'}">✓</span><a class="t" href="?s=${encodeURIComponent(x.slug)}">${esc(titleOf(x.slug, x.title))}</a>
        <button class="ed" data-rename-script="${esc(x.slug)}" data-cur="${esc(titleOf(x.slug, x.title))}" title="Rename">✎</button>
        <button class="recbtn ${x.st.recorded ? 'on' : ''}" data-recorded="${esc(x.slug)}" data-on="${x.st.recorded ? 1 : 0}"><span class="bx">${x.st.recorded ? '✓' : ''}</span>${x.st.recorded ? 'Script recorded' : 'Mark as recorded'}</button>
        <div class="d">${x.created ? 'added ' + esc(nice(x.created)) + ' · ' : ''}updated ${esc(nice(x.updated))} · ${x.sections} sections${x.st.recorded ? ' · recorded' : ''}</div></div>`).join('') || '<div class="empty">Nothing published yet.</div>'}`;
}

// ---------- notes + edits (data comes from the Firestore module below)
// Double-click a line -> edit it in place (stored as an 'edit' note: quote = published text,
// text = new text; the newest edit is shown instead of the published line) or leave a note.
// All of it lives in Firestore config/scriptnotes-<slug>, never in the published JSON.
const who = (e) => String(e || '').split('@')[0];
let EDITING = null;   // {key, mode: 'edit' | 'note'}
const editOf = (si, t) => NOTES.filter((n) => n.type === 'edit' && n.sec === si && n.quote === t).pop();
function noteLine(n, quote) {
  return `<div class="nline ${n.resolved ? 'resolved' : ''}" title="${esc(who(n.by))}">— ${esc(n.text)}${quote ? ` <span style="opacity:.7">(on “${esc(quote)}”)</span>` : ''}<span class="rs" data-resolve="${esc(n.id)}">${n.resolved ? 'reopen' : '✓ done'}</span></div>`;
}
function editorHtml(key, original, shown) {
  const mode = EDITING.mode, edited = shown !== original;
  return `<div class="editbox"><textarea data-etext placeholder="${mode === 'note' ? 'Your note on this line…' : ''}">${mode === 'edit' ? esc(shown) : ''}</textarea>
    <div class="erow">${mode === 'edit'
      ? `<a class="go" data-esave="${key}">Save</a> · <a data-emode="note">add a note instead</a>${edited ? ' · <a data-erevert="' + key + '">back to original</a>' : ''} · <a data-ecancel>cancel</a> <span style="opacity:.6">(Enter saves, Esc cancels)</span>`
      : `<a class="go" data-nsave="${key}">Add note</a> · <a data-emode="edit">edit the line instead</a> · <a data-ecancel>cancel</a>`}</div></div>`;
}
function point(t, si, bucket, k) {
  const key = `${si}|${bucket}|${k}`;
  const ed = editOf(si, t), shown = ed ? ed.text : t;
  const notes = NOTES.filter((n) => n.type !== 'edit' && n.sec === si && n.quote === t);
  if (EDITING && EDITING.key === key) return `<li class="editing" data-key="${key}">${editorHtml(key, t, shown)}${notes.map((n) => noteLine(n)).join('')}</li>`;
  const tip = ed ? ` title="Edited - was: ${esc(t)}"` : '';
  return `<li class="${lineKind(shown)}${ed ? ' was-edited' : ''}" data-key="${key}"${tip}>${fmt(shown)}${notes.map((n) => noteLine(n)).join('')}</li>`;
}

function render() {
  const sc = SC;
  const total = sc.sections.reduce((a, s) => a + (+s.minutes || 0), 0);
  const meta = [sc.channel, total ? `~${Math.round(total)} min` : '', sc.tiers && sc.tiers.length ? 'Tiers: ' + sc.tiers.join(' / ') : '', 'updated ' + nice(sc.updated)].filter(Boolean).join(' · ');
  const api = window.notesApi || {};
  const hint = api.state === 'ready' ? 'Double-click any line to edit it or leave a note.'
    : api.state === 'signedout' ? 'Want to tweak a line or leave a note? <button data-signin>Sign in with Google</button>'
    : api.state === 'denied' ? "This Google account can't edit here - ask Kikis." : '';
  const keep = window.scrollY;
  const openState = [...document.querySelectorAll('details.sec')].map((d) => d.open);
  app.innerHTML = `<div class="top"><a href="script.html">← All scripts</a><span style="flex:1"></span><a href="./">Pipeline board</a></div>
    <div class="h1row"><h1>${tooltips(esc(titleOf(slug, sc.title)))}</h1><button class="ed" data-rename-script="${esc(slug)}" data-cur="${esc(titleOf(slug, sc.title))}" title="Rename">✎</button></div>
    <div class="meta">${esc(meta)}</div>
    <div class="recline">${`<button class="recbtn ${statusOf(slug).recorded ? 'on' : ''}" data-recorded="${esc(slug)}" data-on="${statusOf(slug).recorded ? 1 : 0}"><span class="bx">${statusOf(slug).recorded ? '✓' : ''}</span>${statusOf(slug).recorded ? 'Script recorded' : 'Mark as recorded'}</button>`}</div>
    ${hint ? `<div class="hint">${hint}</div>` : ''}
    <div class="controls"><button id="bOpen">Expand all</button><button id="bClose">Collapse all</button></div>
    ${sc.sections.map((s, i) => {
      const texts = new Set([...s.points, ...s.prompts, ...s.deeper]);
      // notes/edits whose line was changed or removed in a later publish
      // An edit whose new wording is now in the published script was merged by the editor
      // (copied into the Studio + re-published) - it disappears instead of showing as a leftover.
      const orphans = NOTES.filter((n) => n.sec === i && n.quote && !texts.has(n.quote) && !(n.type === 'edit' && texts.has(n.text)));
      return `<details class="sec" ${openState[i] === false ? '' : 'open'}><summary><span class="num">${i + 1}</span><span class="stitle">${tooltips(esc(s.title))}</span></summary>
      ${s.subtitle ? `<div class="sub">${tooltips(esc(s.subtitle))}</div>` : ''}
      <div class="body">
        ${s.points.length ? `<ul>${s.points.map((t, k) => point(t, i, 'points', k)).join('')}</ul>` : ''}
        ${s.prompts.length ? `<div class="take"><b>Your take</b><ul>${s.prompts.map((t, k) => point(t, i, 'prompts', k)).join('')}</ul></div>` : ''}
        ${s.deeper.length ? `<details class="more"><summary>If you want more (${s.deeper.length})</summary><ul>${s.deeper.map((t, k) => point(t, i, 'deeper', k)).join('')}</ul></details>` : ''}
        ${orphans.map((n) => n.type === 'edit'
          ? `<div class="nline">— edited a line that has since changed: “${esc(n.quote)}” → “${esc(n.text)}”<span class="rs" data-del="${esc(n.id)}">✓ done</span></div>`
          : noteLine(n, n.quote)).join('')}
      </div></details>`;
    }).join('')}`;
  window.scrollTo(0, keep);
  const all = (open) => document.querySelectorAll('details.sec').forEach((d) => { d.open = open; });
  document.getElementById('bOpen').onclick = () => all(true);
  document.getElementById('bClose').onclick = () => all(false);
  const ta = document.querySelector('.editbox textarea');
  if (ta && document.activeElement !== ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
window.renderScript = () => { if (slug) { if (SC) { document.title = titleOf(slug, SC.title); if (!EDITING) render(); } } else showList(); };
window.setNotes = (list) => { NOTES = list; if (SC && !EDITING) render(); };

function lineAt(key) {
  const [si, bucket, k] = key.split('|');
  return { si: +si, s: SC.sections[+si], text: SC.sections[+si][bucket][+k] };
}
function openEditor(li) {
  const api = window.notesApi || {};
  if (api.state === 'signedout') { if (confirm('Sign in with Google to edit or leave notes?')) api.signIn(); return; }
  if (api.state !== 'ready') return;
  const d = li.closest('details.more'); if (d) d.open = true;
  window.getSelection().removeAllRanges();
  EDITING = { key: li.dataset.key, mode: 'edit' };
  render();
}
const closeEditor = () => { EDITING = null; render(); };
function saveEdit() {
  const api = window.notesApi, { si, s, text } = lineAt(EDITING.key);
  const v = document.querySelector('.editbox textarea').value.replace(/\s+/g, ' ').trim();
  if (!v) return;
  api.setEdit(si, s.title, text, v).then(closeEditor).catch((err) => alert('Could not save: ' + err.message));
}
function saveNote() {
  const api = window.notesApi, { si, s, text } = lineAt(EDITING.key);
  const v = document.querySelector('.editbox textarea').value.trim();
  if (!v) return;
  api.add({ sec: si, secTitle: s.title, quote: text, type: 'note', text: v }).then(closeEditor).catch((err) => alert('Could not save: ' + err.message));
}

// double-click (and double-tap on phones) a line to edit it
app.addEventListener('dblclick', (e) => {
  const li = e.target.closest('li[data-key]');
  if (li && !li.classList.contains('editing') && !e.target.closest('a,button,textarea,input')) openEditor(li);
});
let lastTap = { t: 0, key: '' };
app.addEventListener('touchend', (e) => {
  const li = e.target.closest('li[data-key]'); if (!li || li.classList.contains('editing')) return;
  const now = Date.now();
  if (lastTap.key === li.dataset.key && now - lastTap.t < 350) { e.preventDefault(); openEditor(li); lastTap = { t: 0, key: '' }; }
  else lastTap = { t: now, key: li.dataset.key };
});
app.addEventListener('keydown', (e) => {
  if (!EDITING || !e.target.matches('.editbox textarea')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); EDITING.mode === 'edit' ? saveEdit() : saveNote(); }
});

app.addEventListener('click', (e) => {
  const t = e.target, api = window.notesApi;
  if (t.matches('[data-signin]')) return api && api.signIn();
  // the whole script card opens the script (its own buttons/links still do their own thing)
  const card = t.closest('.sitem[data-href]');
  if (card && !t.closest('button,a,input,label')) { location.href = card.dataset.href; return; }
  if (t.matches('[data-rename-script]')) {
    const v = prompt('Script title:', t.dataset.cur); if (v && v.trim()) api.setStatus(t.dataset.renameScript, { title: v.trim() }).catch((err) => alert(err.message)); return;
  }
  if (t.matches('[data-rename-idea]')) {
    const r = (api.ideas || []).find((x) => x.id === t.dataset.renameIdea); const v = r && prompt('Idea title:', r.title);
    if (v && v.trim()) api.renameIdea(r.id, v.trim()).catch((err) => alert(err.message)); return;
  }
  if (t.matches('[data-addidea]')) {
    const ti = document.getElementById('newIdea'), no = document.getElementById('newIdeaNotes');
    if (!ti.value.trim()) return ti.focus();
    api.addIdea(ti.value.trim(), no.value.trim()).then(() => { ti.value = ''; no.value = ''; }).catch((err) => alert(err.message)); return;
  }
  const rb = t.closest('[data-recorded]');
  if (rb) { const on = rb.dataset.on !== '1'; api.setStatus(rb.dataset.recorded, { recorded: on, recordedAt: on ? Date.now() : 0 }).catch((err) => alert(err.message)); return; }
  if (t.matches('[data-esave]')) return saveEdit();
  if (t.matches('[data-nsave]')) return saveNote();
  if (t.matches('[data-ecancel]')) return closeEditor();
  if (t.matches('[data-emode]')) { EDITING.mode = t.dataset.emode; render(); return; }
  if (t.matches('[data-erevert]')) { const { si, s, text } = lineAt(t.dataset.erevert); api.setEdit(si, s.title, text, text).then(closeEditor); return; }
  if (t.matches('[data-resolve]')) return api.toggleResolved(t.dataset.resolve);
  if (t.matches('[data-del]')) return api.remove(t.dataset.del);
});
app.addEventListener('change', (e) => {
});

async function showScript() {
  try { SC = await getJson('scripts/' + encodeURIComponent(slug) + '.json'); }
  catch (e) { app.innerHTML = `<div class="top"><a href="script.html">← All scripts</a></div><div class="empty">Script "${esc(slug)}" ${esc(e.message)}.</div>`; return; }
  document.title = titleOf(slug, SC.title);
  render();
}

slug ? showScript() : showList();
</script>

<!-- Notes: Google sign-in + Firestore, same project, sign-in and allowlist as the pipeline board. -->
<script type="module">
// Google sign-in + Firestore, same project / sign-in / allowlist as the pipeline board.
const slug = new URLSearchParams(location.search).get('s');
const api = window.notesApi = { state: 'loading', status: {}, ideas: [] };
const set = (state, extra = {}) => {
  Object.assign(api, { state }, extra);
  document.body.classList.toggle('can-note', state === 'ready' && !!slug);
  document.body.classList.toggle('can-edit', state === 'ready');
  window.renderScript();
};
try {
  const V = 'https://www.gstatic.com/firebasejs/10.13.2/';
  const { initializeApp } = await import(V + 'firebase-app.js');
  const { getFirestore, doc, collection, query, where, onSnapshot, runTransaction, setDoc, updateDoc, addDoc, serverTimestamp } = await import(V + 'firebase-firestore.js');
  const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } = await import(V + 'firebase-auth.js');
  // Public web config (same as index.html) - access is gated by Firestore rules + allowlist.
  const app = initializeApp({
    apiKey: 'AIzaSyCHyVL3XBiqnKRqK1gRIml0EYDnB3A8d6U',
    authDomain: 'ghazzy-video-pipeline-8ecd4.firebaseapp.com',
    projectId: 'ghazzy-video-pipeline-8ecd4',
    storageBucket: 'ghazzy-video-pipeline-8ecd4.firebasestorage.app',
    messagingSenderId: '889310513985',
    appId: '1:889310513985:web:faac82e551a72345d86fc0',
  });
  const db = getFirestore(app), auth = getAuth(app);
  const notesRef = slug && doc(db, 'config', 'scriptnotes-' + slug);
  const statusRef = doc(db, 'config', 'script-status');
  const mutate = (fn) => runTransaction(db, async (tx) => {
    const snap = await tx.get(notesRef);
    tx.set(notesRef, { notes: fn(snap.exists() ? (snap.data().notes || []) : []) });
  });
  Object.assign(api, {
    signIn: () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => alert(e.message)),
    add: (n) => mutate((list) => [...list, Object.assign({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), by: auth.currentUser.email, at: Date.now(), resolved: false }, n)]),
    toggleResolved: (id) => mutate((list) => list.map((n) => n.id === id ? Object.assign({}, n, { resolved: !n.resolved, resolvedBy: auth.currentUser.email }) : n)),
    remove: (id) => mutate((list) => list.filter((n) => n.id !== id)),
    setEdit: (sec, secTitle, quote, text) => mutate((list) => {
      const rest = list.filter((n) => !(n.type === 'edit' && n.sec === sec && n.quote === quote));
      return text === quote ? rest : [...rest, { id: 'e' + Date.now().toString(36), type: 'edit', sec, secTitle, quote, text, by: auth.currentUser.email, at: Date.now() }];
    }),
    // merge:true deep-merges the nested map, so one script's change never touches the others
    setStatus: (sl, patch) => setDoc(statusRef, { scripts: { [sl]: patch } }, { merge: true }),
    renameIdea: (id, title) => updateDoc(doc(db, 'pipeline', id), { title }),
    // same fields as the board's "+ Add To-Do Video" form
    addIdea: (title, notes) => addDoc(collection(db, 'pipeline'), { title, status: 'Idea', doFast: false, notes, upload: '', filename: '', driveFileId: '', pendingDelete: false, createdAt: serverTimestamp() }),
  });
  let unsubs = [];
  onAuthStateChanged(auth, (user) => {
    unsubs.forEach((u) => u()); unsubs = [];
    if (!user) { api.status = {}; api.ideas = []; if (window.setNotes) window.setNotes([]); return set('signedout'); }
    set('loading', { email: user.email });
    const fail = (err) => set(String(err.message).includes('insufficient permissions') ? 'denied' : 'error');
    unsubs.push(onSnapshot(statusRef, (snap) => { api.status = snap.exists() ? (snap.data().scripts || {}) : {}; set('ready'); }, fail));
    if (slug) {
      unsubs.push(onSnapshot(notesRef, (snap) => { set('ready'); window.setNotes(snap.exists() ? (snap.data().notes || []) : []); }, fail));
    } else {
      unsubs.push(onSnapshot(query(collection(db, 'pipeline'), where('status', '==', 'Idea')), (snap) => {
        api.ideas = snap.docs.map((d) => Object.assign({ id: d.id }, d.data(), { createdAtMs: d.data().createdAt && d.data().createdAt.toMillis ? d.data().createdAt.toMillis() : 0 })).filter((r) => !r.pendingDelete && !r.parentId);
        set('ready');
      }, fail));
    }
  });
} catch (err) {
  console.error('[script page]', err);
  set('error');
}
</script>
