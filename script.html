<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Scripts</title>
<!-- Viewer for scripts published by the shorts tool's Video Studio
     (kikis-shorts-tool app/studio/store.py → scripts/<slug>.json + scripts/index.json).
     No list → script.html; one script → script.html?s=<slug>. Talking points only:
     sources, b-roll and editor notes never leave the editor's PC.

     NOTES / FIXES from Ghazzy live in Firestore config/scriptnotes-<slug>, never in the
     script JSON - a re-publish rewrites scripts/<slug>.json but can't touch them. Each note
     stores the bullet text it was made on (`quote`); if that bullet changes in a later
     publish the note stays, shown at the end of its section with the original wording. -->
<style>
:root{--bg:#0f1117;--panel:#171a23;--card:#1d2130;--border:#2a3042;--text:#e8eaf0;--muted:#8b93a7;--accent:#7aa2ff;--take:#2a2414;--take-b:#6b5726;--take-t:#f0c96a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:14px}
.top a{text-decoration:none}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}
.meta{color:var(--muted);font-size:14px;margin-bottom:22px}
.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
button,select,textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent)}
details.sec{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin:10px 0;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:baseline}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted);width:12px;flex:none}
details.sec[open]>summary::before{content:"▾"}
.num{color:var(--accent);font-weight:700;flex:none}
.stitle{font-weight:650;font-size:18px;flex:1}
.mins{color:var(--muted);font-size:13px;flex:none}
.sub{color:var(--muted);font-size:14px;font-style:italic;margin:-6px 0 6px 38px}
.body{padding:0 18px 14px 38px}
.body ul{margin:6px 0;padding-left:20px}.body li{margin:5px 0;position:relative}
.take{background:var(--take);border:1px solid var(--take-b);border-radius:8px;padding:8px 14px;margin:10px 0}
.take b{color:var(--take-t);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
details.more{margin-top:8px;color:var(--muted)}
details.more summary{cursor:pointer;font-size:13px}
.list a.item{display:block;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:10px 0;text-decoration:none;color:var(--text)}
.list a.item:hover{border-color:var(--accent)}
.list .t{font-weight:650;font-size:17px}.list .d{color:var(--muted);font-size:13px}
.empty{color:var(--muted)}

/* Talking-point formatting - same rules as the shorts tool's Video Studio (studio.js lineKind/fmtInline).
   Pros/cons/key points are subtle tinted boxes, in the same spirit as the "Your take" box. */
li.fmt-pro,li.fmt-con,li.fmt-key{list-style:none;margin:8px 0 8px -20px;padding:7px 12px 7px 36px;border-radius:7px;border:1px solid;border-left-width:3px}
li.fmt-pro::before,li.fmt-con::before{position:absolute;left:10px;top:8px;width:17px;height:17px;border-radius:50%;font:700 13px/17px system-ui;text-align:center}
li.fmt-pro{background:#13241a;border-color:#244a33;border-left-color:#4fc47f;color:#cdeed8}
li.fmt-pro::before{content:"+";background:#2b6b45;color:#dfffea}
li.fmt-con{background:#2a1517;border-color:#4d2629;border-left-color:#e0645f;color:#f3d0cf}
li.fmt-con::before{content:"−";background:#7a2e2c;color:#ffe3e2}
li.fmt-key{background:#2a2414;border-color:#5a4a20;border-left-color:#e0b84a;color:#f5e2b0;padding-left:12px}
li.fmt-pro b.lbl{color:#7fe0a5}li.fmt-con b.lbl{color:#ff9d98}
li.fmt-quote{font-style:italic;color:#b9bfcc;border-left:2px solid #4a5068;padding-left:10px;list-style:none;margin-left:-12px}
mark{background:#6b5726;color:#fff;padding:0 3px;border-radius:2px}

/* Notes / fixes (Firestore, separate from the script) */
.notebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin:0 0 14px;font-size:14px;color:var(--muted)}
.notebar b{color:var(--text)}
.ncount{background:#3a3014;color:#f0c96a;border-radius:10px;padding:0 8px;font-size:12px;font-weight:700}
.add-pt{position:absolute;right:-30px;top:2px;opacity:0;border:none;background:none;padding:2px 4px;font-size:14px}
li:hover>.add-pt,.add-pt:focus{opacity:.7}.add-pt:hover{opacity:1}
body:not(.can-note) .add-pt,body:not(.can-note) .add-sec{display:none}
.add-sec{margin-top:8px;font-size:12px;color:var(--muted)}
.notes{margin:4px 0 8px}
.note{background:#1c1a12;border:1px solid #3d3519;border-radius:8px;padding:7px 10px;margin:6px 0;font-size:14px;color:#e9e2c8;list-style:none}
.note.fix{background:#21151a;border-color:#4a2530}.note.question{background:#141c27;border-color:#24364d}
.note.resolved{opacity:.45}
.note .nh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:2px}
.note .tag{font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-size:11px;color:#f0c96a}
.note.fix .tag{color:#ff9d98}.note.question .tag{color:#8fb7ff}
.note .nh .sp{flex:1}.note .nh button{padding:1px 7px;font-size:11px}
.note .q{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:3px}
.note .nt{white-space:pre-wrap}
.composer{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;margin:6px 0;list-style:none}
.composer textarea{width:100%;min-height:64px;cursor:text;margin:6px 0;resize:vertical}
.composer .row{display:flex;gap:6px;align-items:center}
.hide-resolved .note.resolved{display:none}
@media print{body{background:#fff;color:#000}.controls,.top,.notebar,.add-pt,.add-sec,.notes{display:none}details.sec{border-color:#ccc;background:#fff}.take{background:#fff8e6}
  li.fmt-pro{background:#eefaf2;color:#0a5a2a}li.fmt-con{background:#fdeeee;color:#8a1f1a}li.fmt-key{background:#fff3c4;color:#000}mark{background:#fff3c4;color:#000}}
</style>
</head>
<body class="hide-resolved">
<div class="wrap" id="app"><div class="empty">Loading…</div></div>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = document.getElementById('app');
// + green (pro), - red (con), ! amber key point, > quote, **bold**, ==highlight==
function lineKind(t) {
  t = String(t || '').trimStart();
  if (/^\+/.test(t)) return 'fmt-pro';
  if (/^[-−–]/.test(t)) return 'fmt-con';
  if (/^!/.test(t)) return 'fmt-key';
  if (/^>/.test(t)) return 'fmt-quote';
  return '';
}
function fmt(t) {
  const k = lineKind(t);
  let h = esc(String(t).trimStart());
  if (k) h = h.replace(/^(\+|-|−|–|!|&gt;)\s*/, '');
  // "+ Common praise: ..." -> the label before the colon goes bold
  if (k === 'fmt-pro' || k === 'fmt-con' || k === 'fmt-key') h = h.replace(/^([^:]{2,40}):/, '<b class="lbl">$1:</b>');
  return h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/==(.+?)==/g, '<mark>$1</mark>');
}
const slug = new URLSearchParams(location.search).get('s');
let SC = null;        // the published script
let NOTES = [];       // notes from Firestore (window.notesApi)
const OPEN = {};      // open composers: key -> true

async function getJson(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status === 404 ? 'not found' : 'HTTP ' + r.status);
  return r.json();
}

async function showList() {
  document.title = 'Video Scripts';
  let list = [];
  try { list = await getJson('scripts/index.json'); } catch (e) {}
  app.innerHTML = `<div class="top"><a href="./">← Pipeline board</a></div><h1>Video scripts</h1>
    <div class="meta">Talking points for upcoming videos - published from the editor's Video Studio.</div>
    <div class="list">${list.map((s) => `<a class="item" href="?s=${encodeURIComponent(s.slug)}"><div class="t">${esc(s.title)}</div>
      <div class="d">${s.sections} sections · updated ${esc(s.updated)}</div></a>`).join('') || '<div class="empty">Nothing published yet.</div>'}</div>`;
}

// ---------- notes rendering (data comes from the Firestore module below)
const who = (e) => String(e || '').split('@')[0];
const when = (n) => n.at ? new Date(n.at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
function noteHtml(n, showQuote) {
  const mine = window.notesApi && window.notesApi.email === n.by;
  return `<div class="note ${esc(n.type)} ${n.resolved ? 'resolved' : ''}">
    <div class="nh"><span class="tag">${esc(n.type === 'fix' ? 'Fix' : n.type === 'question' ? 'Question' : 'Note')}</span>
      <span>${esc(who(n.by))} · ${esc(when(n))}${n.resolved ? ' · resolved' : ''}</span><span class="sp"></span>
      <button data-resolve="${esc(n.id)}">${n.resolved ? '↺ Reopen' : '✓ Resolve'}</button>${mine ? `<button data-del="${esc(n.id)}" title="Delete">✕</button>` : ''}</div>
    ${showQuote && n.quote ? `<div class="q">on: “${esc(n.quote)}” (this point changed since)</div>` : ''}
    <div class="nt">${esc(n.text)}</div></div>`;
}
function composerHtml(key) {
  return `<div class="composer" data-comp="${esc(key)}"><div class="row"><select data-ctype>
      <option value="note">Note</option><option value="fix">Fix</option><option value="question">Question</option></select>
      <span style="color:var(--muted);font-size:12px">Notes stay on this page - publishing a new version never removes them.</span></div>
    <textarea data-ctext placeholder="What should change, or what do you want to say?"></textarea>
    <div class="row"><button data-csave="${esc(key)}">Save</button><button data-ccancel="${esc(key)}">Cancel</button></div></div>`;
}
function point(t, si, bucket, k) {
  const key = `${si}|${bucket}|${k}`;
  const here = NOTES.filter((n) => n.sec === si && n.quote === t);
  return `<li class="${lineKind(t)}" data-key="${key}">${fmt(t)}<button class="add-pt" data-add="${key}" title="Add a note or fix on this point">💬</button>
    ${here.length || OPEN[key] ? `<div class="notes">${here.map((n) => noteHtml(n)).join('')}${OPEN[key] ? composerHtml(key) : ''}</div>` : ''}</li>`;
}

function render() {
  const sc = SC;
  const total = sc.sections.reduce((a, s) => a + (+s.minutes || 0), 0);
  const mmss = (m) => { const s = Math.round(m * 60); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const meta = [sc.channel, total ? `~${Math.round(total)} min` : '', sc.tiers && sc.tiers.length ? 'Tiers: ' + sc.tiers.join(' / ') : '', 'updated ' + sc.updated].filter(Boolean).join(' · ');
  const openNotes = NOTES.filter((n) => !n.resolved).length;
  const api = window.notesApi;
  const bar = !api ? `<div class="notebar">💬 Notes &amp; fixes: <span id="nstatus">connecting…</span></div>`
    : api.state === 'signedout' ? `<div class="notebar">💬 Want to leave a note or a fix? <button data-signin>Sign in with Google</button></div>`
    : api.state === 'denied' ? `<div class="notebar">💬 Your Google account isn't on the allowlist for notes - ask Kikis.</div>`
    : api.state === 'error' ? `<div class="notebar">💬 Notes unavailable right now (offline?).</div>`
    : `<div class="notebar">💬 <b>${openNotes}</b> open note${openNotes === 1 ? '' : 's'} · hover any point and click 💬 to comment on it
        <span style="flex:1"></span><label><input type="checkbox" data-showres ${document.body.classList.contains('hide-resolved') ? '' : 'checked'}> show resolved</label>
        <span>${esc(who(api.email))}</span></div>`;
  const keep = window.scrollY;
  const openState = [...document.querySelectorAll('details.sec')].map((d) => d.open);
  app.innerHTML = `<div class="top"><a href="script.html">← All scripts</a><span style="flex:1"></span><a href="./">Pipeline board</a></div>
    <h1>${esc(sc.title)}</h1><div class="meta">${esc(meta)}</div>${bar}
    <div class="controls"><button id="bOpen">Expand all</button><button id="bClose">Collapse all</button></div>
    ${sc.sections.map((s, i) => {
      const texts = new Set([...s.points, ...s.prompts, ...s.deeper]);
      const secNotes = NOTES.filter((n) => n.sec === i && (!n.quote || !texts.has(n.quote)));
      const cnt = NOTES.filter((n) => n.sec === i && !n.resolved).length;
      const skey = `${i}|section|0`;
      return `<details class="sec" ${openState[i] === false ? '' : 'open'}><summary><span class="num">${i + 1}</span><span class="stitle">${esc(s.title)}</span>${cnt ? `<span class="ncount">💬 ${cnt}</span>` : ''}${s.minutes ? `<span class="mins">${mmss(s.minutes)}</span>` : ''}</summary>
      ${s.subtitle ? `<div class="sub">${esc(s.subtitle)}</div>` : ''}
      <div class="body">
        ${s.points.length ? `<ul>${s.points.map((t, k) => point(t, i, 'points', k)).join('')}</ul>` : ''}
        ${s.prompts.length ? `<div class="take"><b>Your take</b><ul>${s.prompts.map((t, k) => point(t, i, 'prompts', k)).join('')}</ul></div>` : ''}
        ${s.deeper.length ? `<details class="more"><summary>If you want more (${s.deeper.length})</summary><ul>${s.deeper.map((t, k) => point(t, i, 'deeper', k)).join('')}</ul></details>` : ''}
        ${secNotes.length || OPEN[skey] ? `<div class="notes">${secNotes.map((n) => noteHtml(n, true)).join('')}${OPEN[skey] ? composerHtml(skey) : ''}</div>` : ''}
        <button class="add-sec" data-add="${skey}">💬 Note on this section</button>
      </div></details>`;
    }).join('')}`;
  window.scrollTo(0, keep);
  const all = (open) => document.querySelectorAll('details.sec').forEach((d) => { d.open = open; });
  document.getElementById('bOpen').onclick = () => all(true);
  document.getElementById('bClose').onclick = () => all(false);
}
window.renderScript = () => { if (SC) render(); };
window.setNotes = (list) => { NOTES = list; if (SC && !document.querySelector('.composer textarea:focus')) render(); };

app.addEventListener('click', (e) => {
  const t = e.target, api = window.notesApi;
  if (t.matches('[data-signin]')) return api && api.signIn();
  if (t.matches('[data-add]')) { e.preventDefault(); OPEN[t.dataset.add] = true; render(); const c = document.querySelector(`[data-comp="${t.dataset.add}"] textarea`); if (c) c.focus(); return; }
  if (t.matches('[data-ccancel]')) { delete OPEN[t.dataset.ccancel]; render(); return; }
  if (t.matches('[data-csave]')) {
    const key = t.dataset.csave, box = t.closest('.composer');
    const text = box.querySelector('[data-ctext]').value.trim(); if (!text) return;
    const [si, bucket, k] = key.split('|'); const s = SC.sections[+si];
    const quote = bucket === 'section' ? '' : (s[bucket] || [])[+k] || '';
    t.disabled = true;
    api.add({ sec: +si, secTitle: s.title, bucket, quote, type: box.querySelector('[data-ctype]').value, text })
      .then(() => { delete OPEN[key]; render(); }).catch((err) => { t.disabled = false; alert('Could not save: ' + err.message); });
    return;
  }
  if (t.matches('[data-resolve]')) return api.toggleResolved(t.dataset.resolve);
  if (t.matches('[data-del]') && confirm('Delete this note?')) return api.remove(t.dataset.del);
});
app.addEventListener('change', (e) => {
  if (e.target.matches('[data-showres]')) document.body.classList.toggle('hide-resolved', !e.target.checked);
});

async function showScript() {
  try { SC = await getJson('scripts/' + encodeURIComponent(slug) + '.json'); }
  catch (e) { app.innerHTML = `<div class="top"><a href="script.html">← All scripts</a></div><div class="empty">Script "${esc(slug)}" ${esc(e.message)}.</div>`; return; }
  document.title = SC.title;
  render();
}

slug ? showScript() : showList();
</script>

<!-- Notes: Google sign-in + Firestore, same project, sign-in and allowlist as the pipeline board. -->
<script type="module">
const slug = new URLSearchParams(location.search).get('s');
if (slug) {
  const set = (state, extra = {}) => { window.notesApi = Object.assign(window.notesApi || {}, { state }, extra); document.body.classList.toggle('can-note', state === 'ready'); window.renderScript(); };
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.13.2/';
    const { initializeApp } = await import(V + 'firebase-app.js');
    const { getFirestore, doc, onSnapshot, runTransaction } = await import(V + 'firebase-firestore.js');
    const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } = await import(V + 'firebase-auth.js');
    // Public web config (same as index.html) - access is gated by Firestore rules + allowlist.
    const app = initializeApp({
      apiKey: 'AIzaSyCHyVL3XBiqnKRqK1gRIml0EYDnB3A8d6U',
      authDomain: 'ghazzy-video-pipeline-8ecd4.firebaseapp.com',
      projectId: 'ghazzy-video-pipeline-8ecd4',
      storageBucket: 'ghazzy-video-pipeline-8ecd4.firebasestorage.app',
      messagingSenderId: '889310513985',
      appId: '1:889310513985:web:faac82e551a72345d86fc0',
    });
    const db = getFirestore(app), auth = getAuth(app);
    const ref = doc(db, 'config', 'scriptnotes-' + slug);
    const mutate = (fn) => runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      tx.set(ref, { notes: fn(snap.exists() ? (snap.data().notes || []) : []) });
    });
    window.notesApi = {
      state: 'loading',
      signIn: () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => alert(e.message)),
      add: (n) => mutate((list) => [...list, Object.assign({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), by: auth.currentUser.email, at: Date.now(), resolved: false }, n)]),
      toggleResolved: (id) => mutate((list) => list.map((n) => n.id === id ? Object.assign({}, n, { resolved: !n.resolved, resolvedBy: auth.currentUser.email }) : n)),
      remove: (id) => mutate((list) => list.filter((n) => n.id !== id)),
    };
    let unsub = null;
    onAuthStateChanged(auth, (user) => {
      if (unsub) { unsub(); unsub = null; }
      if (!user) { window.setNotes([]); return set('signedout'); }
      set('loading', { email: user.email });
      unsub = onSnapshot(ref, (snap) => { set('ready'); window.setNotes(snap.exists() ? (snap.data().notes || []) : []); },
        (err) => set(String(err.message).includes('insufficient permissions') ? 'denied' : 'error'));
    });
  } catch (err) {
    console.error('[notes]', err);
    window.notesApi = { state: 'error' }; window.renderScript();
  }
}
</script>
</body>
</html>
