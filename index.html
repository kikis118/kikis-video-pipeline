<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ghazzy's YT Video Pipeline</title>
<style>
  :root {
    --bg: #1c1d21;
    --panel: #26272c;
    --card: #303136;
    --border: #3d3e44;
    --text: #e8e8ea;
    --muted: #9a9ba3;
    --accent: #7c9eff;
    --danger: #ff6b6b;
    --warn: #f5b942;
    --good: #5fd08a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header button, header a { white-space: nowrap; }
  header .spacer { flex: 1; }
  button, a.secondary, a.btn-upload {
    background: var(--accent);
    color: #10131c;
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-sizing: border-box;
    display: inline-block;
  }
  button.secondary, a.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--danger); color: #2a0a0a; }
  button:disabled { opacity: 0.5; cursor: default; }

  button, a.secondary, a.btn-view, a.btn-download, a.btn-upload {
    transition: filter 0.1s ease, transform 0.05s ease;
  }
  button:not(:disabled):hover, a.secondary:hover, a.btn-view:hover, a.btn-download:hover, a.btn-upload:hover {
    filter: brightness(1.15);
    cursor: pointer;
  }
  button:not(:disabled):active, a.secondary:active, a.btn-view:active, a.btn-download:active, a.btn-upload:active {
    filter: brightness(0.92);
    transform: scale(0.98);
  }
  .flag-btn:hover { border-color: var(--muted); }

  a.btn-upload { background: #1c4030; color: var(--good); border: 1px solid var(--good); }

  #status { font-size: 11px; color: var(--muted); padding: 8px 20px 0; }

  #createFolderForm { display: none; gap: 8px; padding: 10px 20px 0; }
  #createFolderForm.open { display: flex; }
  #createFolderForm input { flex: 1; max-width: 320px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 10px; }

  #foldersContainer { display: flex; flex-direction: column; gap: 10px; padding: 12px 20px 20px; }
  .folder-section { background: var(--panel); border-radius: 10px; }
  .folder-section.main { border: 1px solid var(--accent); }
  .folder-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap; }
  .folder-toggle { background: transparent; border: none; color: var(--muted); font-size: 13px; padding: 2px 4px; cursor: pointer; }
  .folder-name { font-size: 14px; font-weight: 700; cursor: text; }
  .folder-name-input { font-size: 14px; font-weight: 700; background: var(--card); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 2px 6px; }
  .folder-badge { background: var(--accent); color: #10131c; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.03em; }
  .folder-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: inline-block; flex-shrink: 0; }
  .folder-count { color: var(--muted); font-size: 12px; }
  .folder-actions { display: flex; gap: 6px; align-items: center; }
  .folder-actions button, .folder-actions a { padding: 4px 8px; font-size: 11px; text-decoration: none; }
  .folder-body { padding: 0 14px 14px; }

  .board { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
  .column { flex: 1; min-width: 240px; background: var(--card); border-radius: 10px; padding: 10px; }
  .column h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 4px 6px 10px; }
  .column .count { color: var(--muted); font-weight: 400; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .card.do-fast { border-left: 3px solid var(--danger); }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--text);
    width: 100%;
    padding: 2px 0;
  }
  .card-title:focus { outline: 1px solid var(--accent); border-radius: 3px; }
  .card-notes {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    resize: vertical;
    min-height: 32px;
    padding: 2px 0;
    font-family: inherit;
  }
  .card-notes:focus { outline: 1px solid var(--accent); border-radius: 3px; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .badge { padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 600; }
  .badge.uploading { background: #4a3d1a; color: var(--warn); }
  .badge.uploaded { background: #1c4030; color: var(--good); }
  .badge.failed { background: #4a1c1c; color: var(--danger); }
  .card-actions { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .card-actions button { padding: 4px 8px; font-size: 11px; }
  .actions-left, .actions-right { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .flag-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .flag-btn.active { background: var(--danger); color: #2a0a0a; border-color: var(--danger); }
  .move-folder-select {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 6px; font-size: 11px; width: 100%; margin-top: 6px;
  }

  .column-more { width: 100%; margin-top: 4px; }

  .card-actions a {
    padding: 4px 8px; font-size: 11px; font-weight: 600; border-radius: 6px;
    text-decoration: none; display: inline-block;
  }
  .btn-view { background: var(--accent); color: #10131c; }
  .btn-download { background: var(--good); color: #06261a; }

  #configPanel { display: none; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #configPanel.open { display: block; }
  #configPanel h2 { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .config-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .config-row .config-key { flex: 0 0 240px; font-size: 13px; font-family: monospace; color: var(--text); }
  .config-row input.config-value { flex: 0 0 160px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 8px; font-size: 13px; }

  .ideas-panel { margin-bottom: 12px; }
  .ideas-panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 8px 0 8px;
  }
  .add-form { display: none; gap: 8px; margin: 8px 0; }
  .add-form.open { display: flex; }
  .add-form input { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 10px; }
  .ideas-list { display: flex; flex-direction: column; gap: 6px; }
  .idea-row {
    display: flex; flex-direction: column; gap: 4px;
    padding: 8px 10px; border-radius: 6px;
    background: transparent; border: 1px dashed var(--border);
  }
  .idea-row-top { display: flex; align-items: center; gap: 8px; }
  .idea-row input.idea-title {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-size: 14px; font-weight: 600; padding: 2px 0;
  }
  .idea-row input.idea-title:focus { outline: 1px solid var(--accent); border-radius: 3px; }
  .idea-notes-view {
    color: var(--muted); font-size: 12px; padding: 2px 0; cursor: text;
    white-space: pre-wrap; word-break: break-word; min-height: 16px;
  }
  .idea-notes-view a { color: var(--accent); }
  .idea-notes-view.empty { font-style: italic; opacity: 0.7; }
  .idea-notes-edit {
    width: 100%; background: transparent; border: none; color: var(--text);
    font-size: 12px; resize: vertical; min-height: 40px; padding: 2px 0;
    font-family: inherit;
  }
  .idea-notes-edit:focus { outline: 1px solid var(--accent); border-radius: 3px; }
  .idea-row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .idea-row-empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 4px 10px; }

  .archived-panel { margin-top: 8px; }
  .archived-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--card); border-radius: 6px; margin-bottom: 4px; font-size: 13px; }

  .card.needs-label { border-color: var(--warn); }
  .needs-label-badge {
    display: inline-block; background: #4a3d1a; color: var(--warn);
    font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 999px;
    margin-bottom: 6px;
  }
  .link-idea-select {
    width: 100%; margin-top: 6px; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px; font-size: 12px;
  }
</style>
</head>
<body>
  <header>
    <button onclick="toggleCreateFolderForm()">+ Create Folder</button>
    <button class="secondary" id="toggleArchivedFoldersBtn" onclick="toggleArchivedFolders()">Show Archived Folders</button>
    <div class="spacer"></div>
    <button class="secondary" onclick="toggleConfig()">&#9881; Config</button>
  </header>

  <div id="configPanel">
    <h2>Bot Config <span class="idea-notes">(changes apply within a few minutes - the streaming-PC app re-checks periodically)</span></h2>
    <div id="configList"></div>
  </div>

  <div id="createFolderForm">
    <input id="newFolderName" placeholder="Folder name (e.g. PoE 2 0.5.5)" />
    <input id="newFolderExisting" placeholder="Or paste an existing Drive folder link/ID (optional)" />
    <button onclick="submitCreateFolder()">Create</button>
    <button class="secondary" onclick="toggleCreateFolderForm()">Cancel</button>
  </div>

  <div id="status">Connecting&hellip;</div>

  <div id="foldersContainer"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import {
      getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDoc, setDoc,
      onSnapshot, serverTimestamp,
    } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';

    // Not a secret - Firebase web config is meant to be public; the real
    // gate is Firestore Security Rules (require signed-in, even
    // anonymously - see webapp/SETUP.md "Access model" for what that does
    // and doesn't protect against).
    const firebaseConfig = {
      apiKey: 'AIzaSyCHyVL3XBiqnKRqK1gRIml0EYDnB3A8d6U',
      authDomain: 'ghazzy-video-pipeline-8ecd4.firebaseapp.com',
      projectId: 'ghazzy-video-pipeline-8ecd4',
      storageBucket: 'ghazzy-video-pipeline-8ecd4.firebasestorage.app',
      messagingSenderId: '889310513985',
      appId: '1:889310513985:web:faac82e551a72345d86fc0',
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    var COLUMNS = ['Recorded', 'Finished'];
    var NEXT_STATUS = { Recorded: 'Finished', Finished: null };
    var PREV_STATUS = { Finished: 'Recorded' };
    var FINISHED_COLLAPSED_COUNT = 3;

    var state = { rows: [], folders: [] };
    var editing = {};
    var expandedActions = {}; // pipeline doc id -> true while "More actions" (Archive/Delete/Move) is revealed
    var expandedFolders = {}; // folder id -> true while expanded (Main is always expanded, not stored here)
    var showArchivedByFolder = {}; // folder id -> true while its per-clip Archived list is shown
    var showAllFinishedByFolder = {}; // "folderId:Finished" -> true while fully expanded
    var showArchivedFolders = false;
    var addFormOpenFolder = null; // folder id whose "+ Add Idea" form is open, or null
    var renamingFolder = null; // folder id currently showing a rename input, or null

    function onError(err) {
      var el = document.getElementById('status');
      var message = (err && err.message) ? err.message : String(err);
      el.textContent = '⚠ Error: ' + message;
      el.style.color = 'var(--danger)';
      el.style.fontWeight = '600';
      console.error('[error]', err);
    }

    function isEditing(id, field) {
      return editing[id + ':' + field] === true;
    }

    function needsLabel(row) {
      if (row.status !== 'Recorded') return false;
      if (!row.title || !row.title.trim()) return true; // title got cleared entirely - still needs one
      return row.filename && row.title === row.filename;
    }

    // A pipeline doc with no folder field is legacy data from before folders
    // existed, or a file the local app's Drive scan found before it knew
    // which category it belonged to - treated as living in whichever folder
    // is currently Main (matches app/lib/driveSync.js's own convention, and
    // is exactly what physically happens to the real Drive file too).
    function rowsForFolder(folder) {
      return state.rows.filter(function (r) {
        return folder.isMain ? (!r.folder || r.folder === folder.id) : r.folder === folder.id;
      });
    }

    // ---------- top-level render ----------

    function renderFolders() {
      var container = document.getElementById('foldersContainer');
      container.innerHTML = '';

      var folders = state.folders.slice().sort(function (a, b) {
        if (a.isMain !== b.isMain) return a.isMain ? -1 : 1;
        return (a.createdAtMs || 0) - (b.createdAtMs || 0);
      });

      var archivedCount = folders.filter(function (f) { return f.archived; }).length;
      var toggleBtn = document.getElementById('toggleArchivedFoldersBtn');
      toggleBtn.textContent = (showArchivedFolders ? 'Hide Archived Folders' : 'Show Archived Folders') + (archivedCount ? ' (' + archivedCount + ')' : '');
      toggleBtn.disabled = archivedCount === 0 && !showArchivedFolders;

      folders.forEach(function (folder) {
        if (folder.archived && !showArchivedFolders) return;
        container.appendChild(renderFolderSection(folder));
      });

      if (!folders.length) {
        var empty = document.createElement('div');
        empty.className = 'idea-row-empty';
        empty.textContent = 'No folders yet - the streaming-PC app creates a default "Main" folder the first time it runs.';
        container.appendChild(empty);
      }
    }

    // ---------- folders ----------

    function renderFolderSection(folder) {
      var isMain = folder.isMain;
      var expanded = isMain || expandedFolders[folder.id] === true;
      var rows = rowsForFolder(folder);
      var needsAttention = rows.some(needsLabel);

      var section = document.createElement('div');
      section.className = 'folder-section' + (isMain ? ' main' : '');

      var header = document.createElement('div');
      header.className = 'folder-header';

      if (!isMain) {
        var toggleBtn = document.createElement('button');
        toggleBtn.className = 'folder-toggle';
        toggleBtn.textContent = expanded ? '▾' : '▸';
        toggleBtn.title = expanded ? 'Collapse' : 'Expand';
        toggleBtn.onclick = function () { expandedFolders[folder.id] = !expanded; renderFolders(); };
        header.appendChild(toggleBtn);
      }

      if (renamingFolder === folder.id) {
        var nameInput = document.createElement('input');
        nameInput.className = 'folder-name-input';
        nameInput.value = folder.name;
        nameInput.addEventListener('blur', function () {
          renamingFolder = null;
          var val = nameInput.value.trim();
          if (val && val !== folder.name) updateDoc(doc(db, 'folders', folder.id), { name: val }).catch(onError);
          else renderFolders();
        });
        header.appendChild(nameInput);
      } else {
        var nameEl = document.createElement('span');
        nameEl.className = 'folder-name';
        nameEl.textContent = folder.name;
        nameEl.title = 'Click to rename';
        nameEl.onclick = function () {
          renamingFolder = folder.id;
          renderFolders();
          var el = document.querySelector('.folder-name-input');
          if (el) { el.focus(); el.select(); }
        };
        header.appendChild(nameEl);
      }

      if (isMain) {
        var badge = document.createElement('span');
        badge.className = 'folder-badge';
        badge.textContent = 'MAIN FOLDER';
        header.appendChild(badge);
      }

      if (!expanded && needsAttention) {
        var dot = document.createElement('span');
        dot.className = 'folder-dot';
        dot.title = 'Something in here has been uploaded and still needs a title';
        header.appendChild(dot);
      }

      var count = document.createElement('span');
      count.className = 'folder-count';
      count.textContent = '(' + rows.length + ')';
      header.appendChild(count);

      header.appendChild(Object.assign(document.createElement('div'), { className: 'spacer' }));

      var actions = document.createElement('div');
      actions.className = 'folder-actions';

      if (folder.driveFolderId) {
        var uploadLink = document.createElement('a');
        uploadLink.className = 'btn-upload';
        uploadLink.href = 'https://drive.google.com/drive/folders/' + encodeURIComponent(folder.driveFolderId);
        uploadLink.target = '_blank';
        uploadLink.rel = 'noopener';
        uploadLink.textContent = '↥ For Ghazzy - Manually Upload Recording';
        actions.appendChild(uploadLink);

        var openFolderLink = document.createElement('a');
        openFolderLink.className = 'secondary';
        openFolderLink.href = 'https://drive.google.com/drive/folders/' + encodeURIComponent(folder.driveFolderId);
        openFolderLink.target = '_blank';
        openFolderLink.rel = 'noopener';
        openFolderLink.textContent = 'Open Folder in Google Drive';
        actions.appendChild(openFolderLink);
      } else {
        var provisioning = document.createElement('span');
        provisioning.className = 'folder-count';
        provisioning.textContent = 'Setting up Drive folder…';
        actions.appendChild(provisioning);
      }

      if (!isMain && !folder.archived) {
        var setMainBtn = document.createElement('button');
        setMainBtn.className = 'secondary';
        setMainBtn.textContent = 'Set as Main Folder';
        setMainBtn.onclick = function () { setMainFolder(folder.id).catch(onError); };
        actions.appendChild(setMainBtn);
      }

      if (!isMain) {
        var archiveBtn = document.createElement('button');
        archiveBtn.className = 'secondary';
        archiveBtn.textContent = folder.archived ? 'Unarchive' : 'Archive';
        archiveBtn.onclick = function () {
          if (!folder.archived && !confirm('Archive folder "' + folder.name + '"? It moves out of the main view - still fully there, nothing is deleted.')) return;
          updateDoc(doc(db, 'folders', folder.id), { archived: !folder.archived }).catch(onError);
        };
        actions.appendChild(archiveBtn);
      }

      header.appendChild(actions);
      section.appendChild(header);

      if (expanded) section.appendChild(renderFolderBody(folder, rows));
      return section;
    }

    async function setMainFolder(folderId) {
      var current = state.folders.find(function (f) { return f.isMain; });
      if (current && current.id !== folderId) await updateDoc(doc(db, 'folders', current.id), { isMain: false });
      await updateDoc(doc(db, 'folders', folderId), { isMain: true });
    }

    function renderFolderBody(folder, rows) {
      var wrap = document.createElement('div');
      wrap.className = 'folder-body';

      var board = document.createElement('div');
      board.className = 'board';
      COLUMNS.forEach(function (statusName) {
        var colRows = rows.filter(function (r) { return r.status === statusName; }).slice().sort(function (a, b) {
          if (a.doFast !== b.doFast) return a.doFast ? -1 : 1;
          return (b.createdAtMs || 0) - (a.createdAtMs || 0);
        });
        var totalCount = colRows.length;
        var isFinished = statusName === 'Finished';
        var key = folder.id + ':' + statusName;
        var showAll = showAllFinishedByFolder[key];
        var displayRows = (isFinished && !showAll) ? colRows.slice(0, FINISHED_COLLAPSED_COUNT) : colRows;

        var col = document.createElement('div');
        col.className = 'column';
        col.innerHTML = '<h2>' + statusName + ' <span class="count">(' + totalCount + ')</span></h2>';
        displayRows.forEach(function (row) { col.appendChild(renderCard(row, rows)); });

        if (isFinished && totalCount > FINISHED_COLLAPSED_COUNT) {
          var toggleBtn = document.createElement('button');
          toggleBtn.className = 'secondary column-more';
          toggleBtn.textContent = showAll ? 'Show fewer' : 'View all (' + totalCount + ')';
          toggleBtn.onclick = function () { showAllFinishedByFolder[key] = !showAll; renderFolders(); };
          col.appendChild(toggleBtn);
        }
        board.appendChild(col);
      });
      wrap.appendChild(board);

      wrap.appendChild(renderIdeasPanel(folder, rows));

      var archivedRows = rows.filter(function (r) { return r.status === 'Archived'; });
      var archOpen = showArchivedByFolder[folder.id] === true;
      var archToggle = document.createElement('button');
      archToggle.className = 'secondary';
      archToggle.textContent = (archOpen ? 'Hide Archived' : 'Show Archived') + ' (' + archivedRows.length + ')';
      archToggle.onclick = function () { showArchivedByFolder[folder.id] = !archOpen; renderFolders(); };
      wrap.appendChild(archToggle);

      if (archOpen) {
        var archivedPanel = document.createElement('div');
        archivedPanel.className = 'archived-panel';
        archivedRows.forEach(function (row) {
          var el = document.createElement('div');
          el.className = 'archived-row';
          el.innerHTML = '<span>' + escapeHtml(row.title) + '</span>';
          var restoreBtn = document.createElement('button');
          restoreBtn.className = 'secondary';
          restoreBtn.textContent = 'Restore to Finished';
          restoreBtn.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { status: 'Finished' }).catch(onError); };
          el.appendChild(restoreBtn);
          archivedPanel.appendChild(el);
        });
        wrap.appendChild(archivedPanel);
      }

      return wrap;
    }

    // ---------- ideas ----------

    function renderIdeasPanel(folder, rows) {
      var panel = document.createElement('div');
      panel.className = 'ideas-panel';

      var addBtn = document.createElement('button');
      var formOpen = addFormOpenFolder === folder.id;
      addBtn.textContent = formOpen ? 'Cancel' : '+ Add Video Idea';
      addBtn.className = formOpen ? 'secondary' : '';
      addBtn.onclick = function () { addFormOpenFolder = formOpen ? null : folder.id; renderFolders(); };
      panel.appendChild(addBtn);

      if (formOpen) panel.appendChild(renderAddIdeaForm(folder));

      var ideas = rows.filter(function (r) { return r.status === 'Idea'; });
      var header = document.createElement('h2');
      header.innerHTML = 'Video Ideas <span class="count">(' + ideas.length + ')</span>';
      panel.appendChild(header);

      var list = document.createElement('div');
      list.className = 'ideas-list';
      if (!ideas.length) {
        var empty = document.createElement('div');
        empty.className = 'idea-row-empty';
        empty.textContent = 'No video ideas yet — click "+ Add Video Idea" above.';
        list.appendChild(empty);
      } else {
        ideas.forEach(function (row) { list.appendChild(renderIdeaRow(row)); });
      }
      panel.appendChild(list);

      return panel;
    }

    function renderAddIdeaForm(folder) {
      var form = document.createElement('div');
      form.className = 'add-form open';

      var titleInput = document.createElement('input');
      titleInput.placeholder = 'Video idea title';
      var notesInput = document.createElement('input');
      notesInput.placeholder = 'Notes (optional)';

      var addBtn = document.createElement('button');
      addBtn.textContent = 'Add';
      addBtn.onclick = function () {
        var title = titleInput.value.trim();
        if (!title) {
          titleInput.style.outline = '2px solid var(--danger)';
          titleInput.placeholder = 'Type a title first';
          titleInput.focus();
          setTimeout(function () { titleInput.style.outline = ''; }, 1500);
          return;
        }
        addDoc(collection(db, 'pipeline'), {
          title: title, status: 'Idea', doFast: false, notes: notesInput.value.trim(),
          upload: '', filename: '', driveFileId: '', pendingDelete: false, folder: folder.id,
          createdAt: serverTimestamp(),
        }).then(function () {
          addFormOpenFolder = null;
          renderFolders();
        }).catch(onError);
      };

      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = function () { addFormOpenFolder = null; renderFolders(); };

      form.appendChild(titleInput);
      form.appendChild(notesInput);
      form.appendChild(addBtn);
      form.appendChild(cancelBtn);
      return form;
    }

    function renderIdeaRow(row) {
      var el = document.createElement('div');
      el.className = 'idea-row';

      var top = document.createElement('div');
      top.className = 'idea-row-top';

      var title = document.createElement('input');
      title.className = 'idea-title';
      title.placeholder = 'Video idea title';
      title.value = row.title;
      title.addEventListener('focus', function () { editing[row.id + ':title'] = true; });
      title.addEventListener('blur', function () {
        delete editing[row.id + ':title'];
        if (title.value.trim() && title.value.trim() !== row.title) updateDoc(doc(db, 'pipeline', row.id), { title: title.value.trim() }).catch(onError);
      });
      top.appendChild(title);
      el.appendChild(top);

      el.appendChild(renderIdeaNotes(row));

      var actions = document.createElement('div');
      actions.className = 'idea-row-actions';

      var flagBtn = document.createElement('button');
      flagBtn.className = 'flag-btn' + (row.doFast ? ' active' : '');
      flagBtn.textContent = row.doFast ? '★ Do Fast' : '☆ Do Fast';
      flagBtn.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { doFast: !row.doFast }).catch(onError); };
      actions.appendChild(flagBtn);

      var deleteBtn = document.createElement('button');
      deleteBtn.className = 'danger';
      deleteBtn.textContent = 'Delete';
      deleteBtn.onclick = function () {
        if (confirm('Delete video idea "' + row.title + '"?')) deleteDoc(doc(db, 'pipeline', row.id)).catch(onError);
      };
      actions.appendChild(deleteBtn);

      el.appendChild(actions);
      return el;
    }

    // Description/notes for an idea - a proper multi-line field, distinct
    // from the title, with URLs rendered as clickable links when not being
    // edited (click-to-edit, like title/notes elsewhere on the board).
    function renderIdeaNotes(row) {
      if (isEditing(row.id, 'notes')) {
        var textarea = document.createElement('textarea');
        textarea.className = 'idea-notes-edit';
        textarea.placeholder = 'Description…';
        textarea.value = row.notes || '';
        textarea.dataset.ideaNotesEdit = row.id;
        textarea.addEventListener('blur', function () {
          delete editing[row.id + ':notes'];
          if (textarea.value !== row.notes) updateDoc(doc(db, 'pipeline', row.id), { notes: textarea.value }).catch(onError);
          else renderFolders();
        });
        return textarea;
      }

      var view = document.createElement('div');
      view.tabIndex = 0;
      if (row.notes) {
        view.className = 'idea-notes-view';
        view.innerHTML = linkify(row.notes);
      } else {
        view.className = 'idea-notes-view empty';
        view.textContent = 'Add a description…';
      }
      view.addEventListener('click', function (e) {
        if (e.target.tagName === 'A') return; // let real links through
        editing[row.id + ':notes'] = true;
        renderFolders();
        var el = document.querySelector('textarea[data-idea-notes-edit="' + row.id + '"]');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
      return view;
    }

    // Idea adopts the video's row (title + appended notes), the idea row
    // is deleted - the info now lives on the real video, keeping a
    // duplicate note around would just be clutter. Sequential, not a
    // batch/transaction: acceptable at this app's scale (two people,
    // rarely if ever hitting this at the same instant).
    async function linkIdeaToRecorded(recordedId, ideaId) {
      var ideaSnap = await getDoc(doc(db, 'pipeline', ideaId));
      if (!ideaSnap.exists() || ideaSnap.data().status !== 'Idea') {
        throw new Error('That idea no longer exists (it may have already been linked or removed).');
      }
      var idea = ideaSnap.data();
      var recordedSnap = await getDoc(doc(db, 'pipeline', recordedId));
      var recorded = recordedSnap.data() || {};
      var mergedNotes = idea.notes ? (recorded.notes ? recorded.notes + '\n' + idea.notes : idea.notes) : recorded.notes;

      await updateDoc(doc(db, 'pipeline', recordedId), { title: idea.title, notes: mergedNotes || '' });
      await deleteDoc(doc(db, 'pipeline', ideaId));
    }

    // ---------- cards ----------

    function renderCard(row, folderRows) {
      var unlabeled = needsLabel(row);
      var card = document.createElement('div');
      card.className = 'card' + (row.doFast ? ' do-fast' : '') + (unlabeled ? ' needs-label' : '');

      if (unlabeled) {
        var badge = document.createElement('div');
        badge.className = 'needs-label-badge';
        badge.textContent = '⚠ Needs a title';
        card.appendChild(badge);
      }

      var title = document.createElement('input');
      title.className = 'card-title';
      title.placeholder = 'Missing title';
      title.value = row.title || '';
      if (!isEditing(row.id, 'title')) title.value = row.title || '';
      title.addEventListener('focus', function () { editing[row.id + ':title'] = true; });
      title.addEventListener('blur', function () {
        delete editing[row.id + ':title'];
        if (title.value.trim() && title.value.trim() !== row.title) {
          updateDoc(doc(db, 'pipeline', row.id), { title: title.value.trim() }).catch(onError);
        } else {
          // Cleared to empty (not a real save - see addEventListener above)
          // or unchanged either way - re-render so the input reflects the
          // real stored value instead of sitting on whatever's left in the
          // field, which nothing else would otherwise trigger a refresh of.
          renderFolders();
        }
      });
      card.appendChild(title);

      var notes = document.createElement('textarea');
      notes.className = 'card-notes';
      notes.placeholder = 'Notes…';
      notes.value = row.notes || '';
      notes.addEventListener('focus', function () { editing[row.id + ':notes'] = true; });
      notes.addEventListener('blur', function () {
        delete editing[row.id + ':notes'];
        if (notes.value !== row.notes) updateDoc(doc(db, 'pipeline', row.id), { notes: notes.value }).catch(onError);
      });
      card.appendChild(notes);

      if (unlabeled) {
        var ideas = folderRows.filter(function (r) { return r.status === 'Idea'; });
        var select = document.createElement('select');
        select.className = 'link-idea-select';
        var placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = ideas.length ? '— Link to a video idea instead of typing a title —' : '(no video ideas to link — just type a title above)';
        select.appendChild(placeholder);
        ideas.forEach(function (idea) {
          var opt = document.createElement('option');
          opt.value = idea.id;
          opt.textContent = idea.title;
          select.appendChild(opt);
        });
        select.onchange = function () {
          if (!select.value) return;
          linkIdeaToRecorded(row.id, select.value).catch(onError);
        };
        card.appendChild(select);
      }

      var meta = document.createElement('div');
      meta.className = 'card-meta';
      if (row.status === 'Recorded' && row.upload) {
        var uploadBadge = document.createElement('span');
        uploadBadge.className = 'badge ' + row.upload.toLowerCase();
        uploadBadge.textContent = row.upload;
        meta.appendChild(uploadBadge);
      }
      if (row.filename) {
        var fn = document.createElement('span');
        fn.textContent = row.filename;
        meta.appendChild(fn);
      }
      if (typeof row.durationMs === 'number') {
        var dur = document.createElement('span');
        dur.textContent = formatDuration(row.durationMs);
        meta.appendChild(dur);
      }
      if (row.uploadedAtMs) {
        var uploadedAt = document.createElement('span');
        uploadedAt.textContent = 'Uploaded ' + formatLocalTime(row.uploadedAtMs);
        meta.appendChild(uploadedAt);
      }
      card.appendChild(meta);

      var actions = document.createElement('div');
      actions.className = 'card-actions';

      // Left = editor-only tools (View/Download - Ghazzy never needs
      // these from the board). Right = Ghazzy's controls (Do Fast,
      // advance/back status) plus the admin-only More/Archive/Delete/Move -
      // kept deliberately separate so the two roles' controls don't mix.
      var left = document.createElement('div');
      left.className = 'actions-left';

      if (row.driveFileId) {
        var viewLink = document.createElement('a');
        viewLink.className = 'btn-view';
        viewLink.href = 'https://drive.google.com/file/d/' + encodeURIComponent(row.driveFileId) + '/view';
        viewLink.target = '_blank';
        viewLink.rel = 'noopener';
        viewLink.textContent = '▶ View';
        left.appendChild(viewLink);

        var downloadLink = document.createElement('a');
        downloadLink.className = 'btn-download';
        downloadLink.href = 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(row.driveFileId);
        downloadLink.target = '_blank';
        downloadLink.rel = 'noopener';
        downloadLink.textContent = '⬇ Download';
        left.appendChild(downloadLink);
      }

      var right = document.createElement('div');
      right.className = 'actions-right';

      var flagBtn = document.createElement('button');
      flagBtn.className = 'flag-btn' + (row.doFast ? ' active' : '');
      flagBtn.textContent = row.doFast ? '★ Do Fast' : '☆ Do Fast';
      flagBtn.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { doFast: !row.doFast }).catch(onError); };
      right.appendChild(flagBtn);

      if (PREV_STATUS[row.status]) {
        var back = document.createElement('button');
        back.className = 'secondary';
        back.textContent = '← ' + PREV_STATUS[row.status];
        back.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { status: PREV_STATUS[row.status] }).catch(onError); };
        right.appendChild(back);
      }
      if (NEXT_STATUS[row.status]) {
        var fwd = document.createElement('button');
        fwd.textContent = NEXT_STATUS[row.status] + ' →';
        fwd.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { status: NEXT_STATUS[row.status] }).catch(onError); };
        right.appendChild(fwd);
      }

      // Archive/Delete/Move are deliberately not one-click-visible - a
      // "More actions" reveal, not a confirm dialog, so a stray click on
      // the card can't land on any of them by accident.
      if (expandedActions[row.id]) {
        var archiveBtn = document.createElement('button');
        archiveBtn.className = 'secondary';
        archiveBtn.textContent = 'Archive';
        archiveBtn.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { status: 'Archived' }).catch(onError); };
        right.appendChild(archiveBtn);

        var deleteBtn = document.createElement('button');
        deleteBtn.className = 'danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = function () {
          var driveNote = row.driveFileId
            ? ' The uploaded file will also be moved to Google Drive\'s trash (recoverable there for a while, not gone instantly - handled by the streaming-PC app within a minute or two, not instantly).'
            : '';
          if (confirm('Delete "' + row.title + '" permanently?' + driveNote + ' This cannot be undone from here (consider Archive instead).')) {
            // Soft delete - the local app is the one with Drive access, so
            // it does the real Drive-trash + doc removal on its own
            // periodic pass (see app/lib/driveSync.js). Filtered out of
            // the board immediately below regardless.
            updateDoc(doc(db, 'pipeline', row.id), { pendingDelete: true }).catch(onError);
          }
        };
        right.appendChild(deleteBtn);

        var closeBtn = document.createElement('button');
        closeBtn.className = 'secondary';
        closeBtn.textContent = '✕';
        closeBtn.title = 'Hide';
        closeBtn.onclick = function () { delete expandedActions[row.id]; renderFolders(); };
        right.appendChild(closeBtn);

        var currentFolderId = row.folder || (state.folders.find(function (f) { return f.isMain; }) || {}).id;
        var moveTargets = state.folders.filter(function (f) { return !f.archived && f.id !== currentFolderId; });
        if (moveTargets.length) {
          var moveSelect = document.createElement('select');
          moveSelect.className = 'move-folder-select';
          var moveDefault = document.createElement('option');
          moveDefault.value = '';
          moveDefault.textContent = 'Move to folder…';
          moveSelect.appendChild(moveDefault);
          moveTargets.forEach(function (f) {
            var opt = document.createElement('option');
            opt.value = f.id;
            opt.textContent = f.name;
            moveSelect.appendChild(opt);
          });
          moveSelect.onchange = function () {
            if (!moveSelect.value) return;
            updateDoc(doc(db, 'pipeline', row.id), { folder: moveSelect.value }).catch(onError);
          };
          right.appendChild(moveSelect);
        }
      } else {
        var moreBtn = document.createElement('button');
        moreBtn.className = 'secondary';
        moreBtn.textContent = '⋯ More';
        moreBtn.onclick = function () { expandedActions[row.id] = true; renderFolders(); };
        right.appendChild(moreBtn);
      }

      actions.appendChild(left);
      actions.appendChild(right);
      card.appendChild(actions);
      return card;
    }

    // ---------- misc helpers ----------

    function escapeHtml(s) {
      var div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // Always the viewer's own browser-local timezone (toLocaleString's
    // default, no explicit timezone override) - deliberately not a fixed
    // timezone, so it always reads as "local time on this PC" regardless
    // of who's looking or where.
    function formatLocalTime(ms) {
      return new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    }

    function formatDuration(ms) {
      var totalSeconds = Math.round(ms / 1000);
      var h = Math.floor(totalSeconds / 3600);
      var m = Math.floor((totalSeconds % 3600) / 60);
      var s = totalSeconds % 60;
      var pad = function (n) { return String(n).padStart(2, '0'); };
      return h > 0 ? (h + ':' + pad(m) + ':' + pad(s)) : (m + ':' + pad(s));
    }

    function linkify(text) {
      var escaped = escapeHtml(text || '');
      return escaped.replace(/(https?:\/\/[^\s<]+)/g, function (url) {
        return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
      });
    }

    function toggleArchivedFolders() {
      showArchivedFolders = !showArchivedFolders;
      renderFolders();
    }

    function toggleCreateFolderForm() {
      document.getElementById('createFolderForm').classList.toggle('open');
    }

    // Accepts a full Drive folder URL (any of Drive's link formats that
    // contain /folders/<id>) or a bare folder id pasted directly.
    function extractDriveFolderId(input) {
      var trimmed = input.trim();
      var match = trimmed.match(/\/folders\/([a-zA-Z0-9_-]+)/);
      if (match) return match[1];
      return trimmed.replace(/[?#].*$/, '');
    }

    function submitCreateFolder() {
      var input = document.getElementById('newFolderName');
      var existingInput = document.getElementById('newFolderExisting');
      var name = input.value.trim();
      if (!name) {
        input.style.outline = '2px solid var(--danger)';
        input.placeholder = 'Type a name first';
        input.focus();
        setTimeout(function () { input.style.outline = ''; }, 1500);
        return;
      }
      // driveFolderId starts null (unless linking an existing Drive folder
      // below) - the streaming-PC app's driveSync.js provisions the actual
      // Drive subfolder on its next tick and writes the id back (the
      // frontend has no Drive credentials of its own). Linking an existing
      // folder skips provisioning entirely - driveSync's next scan will
      // pick up whatever .mp4 files are already sitting in it, same as any
      // other folder.
      var existingId = existingInput.value.trim() ? extractDriveFolderId(existingInput.value) : null;
      addDoc(collection(db, 'folders'), {
        name: name, isMain: false, archived: false, driveFolderId: existingId, createdAt: serverTimestamp(),
      }).then(function () {
        input.value = '';
        existingInput.value = '';
        document.getElementById('createFolderForm').classList.remove('open');
      }).catch(onError);
    }

    // ---------- config panel ----------

    var configLoaded = false;

    function toggleConfig() {
      var panel = document.getElementById('configPanel');
      var opening = !panel.classList.contains('open');
      panel.classList.toggle('open', opening);
      if (opening && !configLoaded) refreshConfig();
    }

    var CONFIG_KEYS = ['DISK_CLEANUP_TRIGGER_GB', 'DISK_CLEANUP_TARGET_GB', 'DISK_CLEANUP_DRY_RUN', 'UPLOAD_THROTTLE_MBPS'];
    var CONFIG_DEFAULTS = { DISK_CLEANUP_TRIGGER_GB: '150', DISK_CLEANUP_TARGET_GB: '130', DISK_CLEANUP_DRY_RUN: 'true', UPLOAD_THROTTLE_MBPS: '50' };

    async function refreshConfig() {
      try {
        var snap = await getDoc(doc(db, 'config', 'settings'));
        var values = snap.exists() ? snap.data() : {};
        var rows = CONFIG_KEYS.map(function (key) {
          return { key: key, value: values[key] !== undefined ? values[key] : CONFIG_DEFAULTS[key] };
        });
        renderConfig(rows);
      } catch (err) {
        onError(err);
      }
    }

    function renderConfig(rows) {
      configLoaded = true;
      var list = document.getElementById('configList');
      list.innerHTML = '';
      rows.forEach(function (row) {
        var el = document.createElement('div');
        el.className = 'config-row';

        var key = document.createElement('span');
        key.className = 'config-key';
        key.textContent = row.key;
        el.appendChild(key);

        var value = document.createElement('input');
        value.className = 'config-value';
        value.value = row.value;
        value.addEventListener('blur', function () {
          if (value.value !== String(row.value)) {
            var patch = {};
            patch[row.key] = value.value;
            setDoc(doc(db, 'config', 'settings'), patch, { merge: true }).catch(onError);
          }
        });
        el.appendChild(value);

        list.appendChild(el);
      });
    }

    // ---------- boot ----------

    function boot() {
      onSnapshot(collection(db, 'pipeline'), function (snapshot) {
        state.rows = snapshot.docs
          .map(function (d) {
            var data = d.data();
            return Object.assign({ id: d.id }, data, {
              createdAtMs: data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : 0,
              uploadedAtMs: data.uploadedAt && data.uploadedAt.toMillis ? data.uploadedAt.toMillis() : 0,
            });
          })
          // Soft-deleted rows disappear immediately, even before the
          // local app has actually processed the delete in the background.
          .filter(function (r) { return !r.pendingDelete; });
        document.getElementById('status').textContent = 'Live — updates instantly, no refresh needed.';
        document.getElementById('status').style.color = '';
        document.getElementById('status').style.fontWeight = '';
        renderFolders();
      }, onError);

      onSnapshot(collection(db, 'folders'), function (snapshot) {
        state.folders = snapshot.docs.map(function (d) {
          var data = d.data();
          return Object.assign({ id: d.id }, data, {
            createdAtMs: data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : 0,
          });
        });
        renderFolders();
      }, onError);
    }

    // Module scripts don't expose top-level functions on window, but the
    // HTML uses inline onclick="..." attributes for these - so they need
    // to be attached explicitly.
    window.toggleConfig = toggleConfig;
    window.toggleArchivedFolders = toggleArchivedFolders;
    window.toggleCreateFolderForm = toggleCreateFolderForm;
    window.submitCreateFolder = submitCreateFolder;

    signInAnonymously(auth).then(boot).catch(onError);
  </script>
</body>
</html>
