<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ghazzy's YT Video Pipeline</title>
<style>
  :root {
    --bg: #1c1d21;
    --panel: #26272c;
    --card: #303136;
    --border: #3d3e44;
    --text: #e8e8ea;
    --muted: #9a9ba3;
    --accent: #7c9eff;
    --danger: #ff6b6b;
    --warn: #f5b942;
    --good: #5fd08a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header button, header a { white-space: nowrap; }
  button, a.secondary, a.btn-upload {
    background: var(--accent);
    color: #10131c;
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-sizing: border-box;
    display: inline-block;
  }
  button.secondary, a.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--danger); color: #2a0a0a; }
  button:disabled { opacity: 0.5; cursor: default; }

  button, a.secondary, a.btn-view, a.btn-download, a.btn-upload {
    transition: filter 0.1s ease, transform 0.05s ease;
  }
  button:not(:disabled):hover, a.secondary:hover, a.btn-view:hover, a.btn-download:hover, a.btn-upload:hover {
    filter: brightness(1.15);
    cursor: pointer;
  }
  button:not(:disabled):active, a.secondary:active, a.btn-view:active, a.btn-download:active, a.btn-upload:active {
    filter: brightness(0.92);
    transform: scale(0.98);
  }
  .flag-btn:hover { border-color: var(--muted); }

  #board { display: flex; gap: 14px; padding: 16px; align-items: flex-start; }
  .column { flex: 1; min-width: 240px; background: var(--panel); border-radius: 10px; padding: 10px; }
  .column h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 4px 6px 10px; }
  .column .count { color: var(--muted); font-weight: 400; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .card.do-fast { border-left: 3px solid var(--danger); }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--text);
    width: 100%;
    padding: 2px 0;
  }
  .card-title:focus { outline: 1px solid var(--accent); border-radius: 3px; }
  .card-notes {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    resize: vertical;
    min-height: 32px;
    padding: 2px 0;
    font-family: inherit;
  }
  .card-notes:focus { outline: 1px solid var(--accent); border-radius: 3px; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .badge { padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 600; }
  .badge.uploading { background: #4a3d1a; color: var(--warn); }
  .badge.uploaded { background: #1c4030; color: var(--good); }
  .badge.failed { background: #4a1c1c; color: var(--danger); }
  .card-actions { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .card-actions button { padding: 4px 8px; font-size: 11px; }
  .actions-left, .actions-right { display: flex; gap: 6px; flex-wrap: wrap; }
  .flag-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .flag-btn.active { background: var(--danger); color: #2a0a0a; border-color: var(--danger); }

  .column-more { width: 100%; margin-top: 4px; }

  .card-actions a {
    padding: 4px 8px; font-size: 11px; font-weight: 600; border-radius: 6px;
    text-decoration: none; display: inline-block;
  }
  .btn-view { background: var(--accent); color: #10131c; }
  .btn-download { background: var(--good); color: #06261a; }

  #uploadLink.btn-upload { background: #1c4030; color: var(--good); border: 1px solid var(--good); }

  #addForm { display: none; gap: 8px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #addForm.open { display: flex; }
  #addForm input { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 10px; }

  #archivedPanel { display: none; padding: 0 20px 20px; }
  #archivedPanel.open { display: block; }
  #archivedPanel h2 { font-size: 13px; color: var(--muted); }
  .archived-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--panel); border-radius: 6px; margin-bottom: 4px; font-size: 13px; }

  #configPanel { display: none; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #configPanel.open { display: block; }
  #configPanel h2 { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .config-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .config-row .config-key { flex: 0 0 240px; font-size: 13px; font-family: monospace; color: var(--text); }
  .config-row input.config-value { flex: 0 0 160px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 8px; font-size: 13px; }

  #status { font-size: 11px; color: var(--muted); padding: 0 20px; }

  #ideasPanel { padding: 12px 20px; }
  #ideasPanel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 0 0 8px;
  }
  #ideasList { display: flex; flex-direction: column; gap: 4px; }
  .idea-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; border-radius: 6px;
    background: transparent; border: 1px dashed var(--border);
  }
  .idea-row input.idea-title {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-size: 13px; padding: 2px 0;
  }
  .idea-row input.idea-title:focus { outline: 1px solid var(--accent); border-radius: 3px; }
  .idea-row .idea-notes { color: var(--muted); font-size: 11px; }
  .idea-row-empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 4px 10px; }

  .card.needs-label { border-color: var(--warn); }
  .needs-label-badge {
    display: inline-block; background: #4a3d1a; color: var(--warn);
    font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 999px;
    margin-bottom: 6px;
  }
  .link-idea-select {
    width: 100%; margin-top: 6px; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px; font-size: 12px;
  }
</style>
</head>
<body>
  <header>
    <h1>Ghazzy's YT Video Pipeline</h1>
    <button class="secondary" onclick="toggleConfig()">&#9881; Config</button>
    <a id="uploadLink" class="btn-upload" href="#" target="_blank" rel="noopener" style="text-decoration:none;">&#8613; Upload a Recording</a>
    <button class="secondary" id="toggleArchivedBtn" onclick="toggleArchived()">Show Archived</button>
    <button onclick="toggleAddForm()">+ Add Idea</button>
  </header>

  <div id="configPanel">
    <h2>Bot Config <span class="idea-notes">(changes apply within a few minutes - the streaming-PC app re-checks periodically)</span></h2>
    <div id="configList"></div>
  </div>

  <div id="addForm">
    <input id="newTitle" placeholder="Video idea title" />
    <input id="newNotes" placeholder="Notes (optional)" />
    <button onclick="submitIdea()">Add</button>
    <button class="secondary" onclick="toggleAddForm()">Cancel</button>
  </div>

  <div id="status">Connecting&hellip;</div>

  <div id="board"></div>

  <div id="ideasPanel">
    <h2>Ideas <span class="count" id="ideasCount"></span></h2>
    <div id="ideasList"></div>
  </div>

  <div id="archivedPanel">
    <h2>Archived</h2>
    <div id="archivedList"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import {
      getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDoc, setDoc,
      onSnapshot, serverTimestamp,
    } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';

    // Not a secret - Firebase web config is meant to be public; the real
    // gate is Firestore Security Rules (require signed-in, even
    // anonymously - see webapp/SETUP.md "Access model" for what that does
    // and doesn't protect against).
    const firebaseConfig = {
      apiKey: 'AIzaSyCHyVL3XBiqnKRqK1gRIml0EYDnB3A8d6U',
      authDomain: 'ghazzy-video-pipeline-8ecd4.firebaseapp.com',
      projectId: 'ghazzy-video-pipeline-8ecd4',
      storageBucket: 'ghazzy-video-pipeline-8ecd4.firebasestorage.app',
      messagingSenderId: '889310513985',
      appId: '1:889310513985:web:faac82e551a72345d86fc0',
    };
    // Not secret either - Drive folder sharing permissions are the real
    // gate on who can actually open/download files, same as before.
    const DRIVE_FOLDER_URL = 'https://drive.google.com/drive/folders/10ch9Ji9dFXOqvyB172W_1_XDYaqgxwPY';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    var COLUMNS = ['Recorded', 'Finished'];
    var NEXT_STATUS = { Recorded: 'Finished', Finished: null };
    var PREV_STATUS = { Finished: 'Recorded' };

    var state = { rows: [] };
    var editing = {};
    var expandedActions = {}; // id -> true while "More actions" (Archive/Delete) is revealed
    var showArchived = false;
    var showAllFinished = false;
    var FINISHED_COLLAPSED_COUNT = 3;

    document.getElementById('uploadLink').href = DRIVE_FOLDER_URL;

    function onError(err) {
      var el = document.getElementById('status');
      var message = (err && err.message) ? err.message : String(err);
      el.textContent = '⚠ Error: ' + message;
      el.style.color = 'var(--danger)';
      el.style.fontWeight = '600';
      console.error('[error]', err);
    }

    function isEditing(id, field) {
      return editing[id + ':' + field] === true;
    }

    function render() {
      var board = document.getElementById('board');
      board.innerHTML = '';
      COLUMNS.forEach(function (statusName) {
        // Do Fast items float to the top; within each group, most
        // recently added first.
        var rows = state.rows.filter(function (r) { return r.status === statusName; }).slice().sort(function (a, b) {
          if (a.doFast !== b.doFast) return a.doFast ? -1 : 1;
          return (b.createdAtMs || 0) - (a.createdAtMs || 0);
        });
        var totalCount = rows.length;
        var isFinished = statusName === 'Finished';
        var displayRows = (isFinished && !showAllFinished) ? rows.slice(0, FINISHED_COLLAPSED_COUNT) : rows;

        var col = document.createElement('div');
        col.className = 'column';
        col.innerHTML = '<h2>' + statusName + ' <span class="count">(' + totalCount + ')</span></h2>';
        displayRows.forEach(function (row) { col.appendChild(renderCard(row)); });

        if (isFinished && totalCount > FINISHED_COLLAPSED_COUNT) {
          var toggleBtn = document.createElement('button');
          toggleBtn.className = 'secondary column-more';
          toggleBtn.textContent = showAllFinished ? 'Show fewer' : 'View all (' + totalCount + ')';
          toggleBtn.onclick = function () { showAllFinished = !showAllFinished; render(); };
          col.appendChild(toggleBtn);
        }

        board.appendChild(col);
      });
      renderIdeas();
      renderArchived();
    }

    function needsLabel(row) {
      return row.status === 'Recorded' && row.filename && row.title === row.filename;
    }

    function renderIdeas() {
      var ideas = state.rows.filter(function (r) { return r.status === 'Idea'; });
      document.getElementById('ideasCount').textContent = '(' + ideas.length + ')';
      var list = document.getElementById('ideasList');
      list.innerHTML = '';
      if (!ideas.length) {
        var empty = document.createElement('div');
        empty.className = 'idea-row-empty';
        empty.textContent = 'No ideas yet — click "+ Add Idea" above.';
        list.appendChild(empty);
        return;
      }
      ideas.forEach(function (row) {
        var el = document.createElement('div');
        el.className = 'idea-row';

        var title = document.createElement('input');
        title.className = 'idea-title';
        title.value = row.title;
        title.addEventListener('focus', function () { editing[row.id + ':title'] = true; });
        title.addEventListener('blur', function () {
          delete editing[row.id + ':title'];
          if (title.value.trim() && title.value.trim() !== row.title) updateDoc(doc(db, 'pipeline', row.id), { title: title.value.trim() }).catch(onError);
        });
        el.appendChild(title);

        if (row.notes) {
          var notes = document.createElement('span');
          notes.className = 'idea-notes';
          notes.textContent = row.notes;
          el.appendChild(notes);
        }

        var flagBtn = document.createElement('button');
        flagBtn.className = 'flag-btn' + (row.doFast ? ' active' : '');
        flagBtn.textContent = row.doFast ? '★' : '☆';
        flagBtn.title = 'Do Fast';
        flagBtn.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { doFast: !row.doFast }).catch(onError); };
        el.appendChild(flagBtn);

        var deleteBtn = document.createElement('button');
        deleteBtn.className = 'danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = function () {
          if (confirm('Delete idea "' + row.title + '"?')) deleteDoc(doc(db, 'pipeline', row.id)).catch(onError);
        };
        el.appendChild(deleteBtn);

        list.appendChild(el);
      });
    }

    function renderCard(row) {
      var unlabeled = needsLabel(row);
      var card = document.createElement('div');
      card.className = 'card' + (row.doFast ? ' do-fast' : '') + (unlabeled ? ' needs-label' : '');

      if (unlabeled) {
        var badge = document.createElement('div');
        badge.className = 'needs-label-badge';
        badge.textContent = '⚠ Needs a title';
        card.appendChild(badge);
      }

      var title = document.createElement('input');
      title.className = 'card-title';
      title.value = row.title;
      if (!isEditing(row.id, 'title')) title.value = row.title;
      title.addEventListener('focus', function () { editing[row.id + ':title'] = true; });
      title.addEventListener('blur', function () {
        delete editing[row.id + ':title'];
        if (title.value.trim() && title.value.trim() !== row.title) {
          updateDoc(doc(db, 'pipeline', row.id), { title: title.value.trim() }).catch(onError);
        }
      });
      card.appendChild(title);

      var notes = document.createElement('textarea');
      notes.className = 'card-notes';
      notes.placeholder = 'Notes…';
      notes.value = row.notes || '';
      notes.addEventListener('focus', function () { editing[row.id + ':notes'] = true; });
      notes.addEventListener('blur', function () {
        delete editing[row.id + ':notes'];
        if (notes.value !== row.notes) updateDoc(doc(db, 'pipeline', row.id), { notes: notes.value }).catch(onError);
      });
      card.appendChild(notes);

      if (unlabeled) {
        var ideas = state.rows.filter(function (r) { return r.status === 'Idea'; });
        var select = document.createElement('select');
        select.className = 'link-idea-select';
        var placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = ideas.length ? '— Link to an idea instead of typing a title —' : '(no ideas to link — just type a title above)';
        select.appendChild(placeholder);
        ideas.forEach(function (idea) {
          var opt = document.createElement('option');
          opt.value = idea.id;
          opt.textContent = idea.title;
          select.appendChild(opt);
        });
        select.onchange = function () {
          if (!select.value) return;
          linkIdeaToRecorded(row.id, select.value).catch(onError);
        };
        card.appendChild(select);
      }

      var meta = document.createElement('div');
      meta.className = 'card-meta';
      if (row.status === 'Recorded' && row.upload) {
        var uploadBadge = document.createElement('span');
        uploadBadge.className = 'badge ' + row.upload.toLowerCase();
        uploadBadge.textContent = row.upload;
        meta.appendChild(uploadBadge);
      }
      if (row.filename) {
        var fn = document.createElement('span');
        fn.textContent = row.filename;
        meta.appendChild(fn);
      }
      card.appendChild(meta);

      var actions = document.createElement('div');
      actions.className = 'card-actions';

      // Left = editor-only tools (View/Download - Ghazzy never needs
      // these from the board). Right = Ghazzy's controls (Do Fast,
      // advance/back status) plus the admin-only More/Archive/Delete -
      // kept deliberately separate so the two roles' controls don't mix.
      var left = document.createElement('div');
      left.className = 'actions-left';

      if (row.driveFileId) {
        var viewLink = document.createElement('a');
        viewLink.className = 'btn-view';
        viewLink.href = 'https://drive.google.com/file/d/' + encodeURIComponent(row.driveFileId) + '/view';
        viewLink.target = '_blank';
        viewLink.rel = 'noopener';
        viewLink.textContent = '▶ View';
        left.appendChild(viewLink);

        var downloadLink = document.createElement('a');
        downloadLink.className = 'btn-download';
        downloadLink.href = 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(row.driveFileId);
        downloadLink.target = '_blank';
        downloadLink.rel = 'noopener';
        downloadLink.textContent = '⬇ Download';
        left.appendChild(downloadLink);
      }

      var right = document.createElement('div');
      right.className = 'actions-right';

      var flagBtn = document.createElement('button');
      flagBtn.className = 'flag-btn' + (row.doFast ? ' active' : '');
      flagBtn.textContent = row.doFast ? '★ Do Fast' : '☆ Do Fast';
      flagBtn.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { doFast: !row.doFast }).catch(onError); };
      right.appendChild(flagBtn);

      if (PREV_STATUS[row.status]) {
        var back = document.createElement('button');
        back.className = 'secondary';
        back.textContent = '← ' + PREV_STATUS[row.status];
        back.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { status: PREV_STATUS[row.status] }).catch(onError); };
        right.appendChild(back);
      }
      if (NEXT_STATUS[row.status]) {
        var fwd = document.createElement('button');
        fwd.textContent = NEXT_STATUS[row.status] + ' →';
        fwd.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { status: NEXT_STATUS[row.status] }).catch(onError); };
        right.appendChild(fwd);
      }

      // Archive/Delete are deliberately not one-click-visible - a "More
      // actions" reveal, not a confirm dialog, so a stray click on the
      // card can't land on either by accident.
      if (expandedActions[row.id]) {
        var archiveBtn = document.createElement('button');
        archiveBtn.className = 'secondary';
        archiveBtn.textContent = 'Archive';
        archiveBtn.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { status: 'Archived' }).catch(onError); };
        right.appendChild(archiveBtn);

        var deleteBtn = document.createElement('button');
        deleteBtn.className = 'danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = function () {
          var driveNote = row.driveFileId
            ? ' The uploaded file will also be moved to Google Drive\'s trash (recoverable there for a while, not gone instantly - handled by the streaming-PC app within a few minutes, not instantly).'
            : '';
          if (confirm('Delete "' + row.title + '" permanently?' + driveNote + ' This cannot be undone from here (consider Archive instead).')) {
            // Soft delete - the local app is the one with Drive access, so
            // it does the real Drive-trash + doc removal on its own
            // periodic pass (see app/lib/driveSync.js). Filtered out of
            // the board immediately below regardless.
            updateDoc(doc(db, 'pipeline', row.id), { pendingDelete: true }).catch(onError);
          }
        };
        right.appendChild(deleteBtn);

        var closeBtn = document.createElement('button');
        closeBtn.className = 'secondary';
        closeBtn.textContent = '✕';
        closeBtn.title = 'Hide';
        closeBtn.onclick = function () { delete expandedActions[row.id]; render(); };
        right.appendChild(closeBtn);
      } else {
        var moreBtn = document.createElement('button');
        moreBtn.className = 'secondary';
        moreBtn.textContent = '⋯ More';
        moreBtn.onclick = function () { expandedActions[row.id] = true; render(); };
        right.appendChild(moreBtn);
      }

      actions.appendChild(left);
      actions.appendChild(right);
      card.appendChild(actions);
      return card;
    }

    function renderArchived() {
      var list = document.getElementById('archivedList');
      list.innerHTML = '';
      state.rows.filter(function (r) { return r.status === 'Archived'; }).forEach(function (row) {
        var el = document.createElement('div');
        el.className = 'archived-row';
        el.innerHTML = '<span>' + escapeHtml(row.title) + '</span>';
        var restoreBtn = document.createElement('button');
        restoreBtn.className = 'secondary';
        restoreBtn.textContent = 'Restore to Finished';
        restoreBtn.onclick = function () { updateDoc(doc(db, 'pipeline', row.id), { status: 'Finished' }).catch(onError); };
        el.appendChild(restoreBtn);
        list.appendChild(el);
      });
    }

    function escapeHtml(s) {
      var div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // Idea adopts the video's row (title + appended notes), the idea row
    // is deleted - the info now lives on the real video, keeping a
    // duplicate note around would just be clutter. Sequential, not a
    // batch/transaction: acceptable at this app's scale (two people,
    // rarely if ever hitting this at the same instant).
    async function linkIdeaToRecorded(recordedId, ideaId) {
      var ideaSnap = await getDoc(doc(db, 'pipeline', ideaId));
      if (!ideaSnap.exists() || ideaSnap.data().status !== 'Idea') {
        throw new Error('That idea no longer exists (it may have already been linked or removed).');
      }
      var idea = ideaSnap.data();
      var recordedSnap = await getDoc(doc(db, 'pipeline', recordedId));
      var recorded = recordedSnap.data() || {};
      var mergedNotes = idea.notes ? (recorded.notes ? recorded.notes + '\n' + idea.notes : idea.notes) : recorded.notes;

      await updateDoc(doc(db, 'pipeline', recordedId), { title: idea.title, notes: mergedNotes || '' });
      await deleteDoc(doc(db, 'pipeline', ideaId));
    }

    function toggleArchived() {
      showArchived = !showArchived;
      document.getElementById('archivedPanel').classList.toggle('open', showArchived);
      document.getElementById('toggleArchivedBtn').textContent = showArchived ? 'Hide Archived' : 'Show Archived';
    }

    function toggleAddForm() {
      document.getElementById('addForm').classList.toggle('open');
    }

    var configLoaded = false;

    function toggleConfig() {
      var panel = document.getElementById('configPanel');
      var opening = !panel.classList.contains('open');
      panel.classList.toggle('open', opening);
      if (opening && !configLoaded) refreshConfig();
    }

    var CONFIG_KEYS = ['DISK_CLEANUP_TRIGGER_GB', 'DISK_CLEANUP_TARGET_GB', 'DISK_CLEANUP_DRY_RUN', 'UPLOAD_THROTTLE_MBPS'];
    var CONFIG_DEFAULTS = { DISK_CLEANUP_TRIGGER_GB: '150', DISK_CLEANUP_TARGET_GB: '130', DISK_CLEANUP_DRY_RUN: 'true', UPLOAD_THROTTLE_MBPS: '50' };

    async function refreshConfig() {
      try {
        var snap = await getDoc(doc(db, 'config', 'settings'));
        var values = snap.exists() ? snap.data() : {};
        var rows = CONFIG_KEYS.map(function (key) {
          return { key: key, value: values[key] !== undefined ? values[key] : CONFIG_DEFAULTS[key] };
        });
        renderConfig(rows);
      } catch (err) {
        onError(err);
      }
    }

    function renderConfig(rows) {
      configLoaded = true;
      var list = document.getElementById('configList');
      list.innerHTML = '';
      rows.forEach(function (row) {
        var el = document.createElement('div');
        el.className = 'config-row';

        var key = document.createElement('span');
        key.className = 'config-key';
        key.textContent = row.key;
        el.appendChild(key);

        var value = document.createElement('input');
        value.className = 'config-value';
        value.value = row.value;
        value.addEventListener('blur', function () {
          if (value.value !== String(row.value)) {
            var patch = {};
            patch[row.key] = value.value;
            setDoc(doc(db, 'config', 'settings'), patch, { merge: true }).catch(onError);
          }
        });
        el.appendChild(value);

        list.appendChild(el);
      });
    }

    function submitIdea() {
      var titleInput = document.getElementById('newTitle');
      var title = titleInput.value.trim();
      if (!title) {
        titleInput.style.outline = '2px solid var(--danger)';
        titleInput.placeholder = 'Type a title first';
        titleInput.focus();
        setTimeout(function () { titleInput.style.outline = ''; }, 1500);
        return;
      }
      var notes = document.getElementById('newNotes').value.trim();
      addDoc(collection(db, 'pipeline'), {
        title: title, status: 'Idea', doFast: false, notes: notes,
        upload: '', filename: '', driveFileId: '', pendingDelete: false,
        createdAt: serverTimestamp(),
      }).then(function () {
        titleInput.value = '';
        document.getElementById('newNotes').value = '';
        toggleAddForm();
      }).catch(onError);
    }

    function boot() {
      onSnapshot(collection(db, 'pipeline'), function (snapshot) {
        state.rows = snapshot.docs
          .map(function (d) {
            var data = d.data();
            return Object.assign({ id: d.id }, data, {
              createdAtMs: data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : 0,
            });
          })
          // Soft-deleted rows disappear immediately, even before the
          // local app has actually processed the delete in the background.
          .filter(function (r) { return !r.pendingDelete; });
        document.getElementById('status').textContent = 'Live — updates instantly, no refresh needed.';
        document.getElementById('status').style.color = '';
        document.getElementById('status').style.fontWeight = '';
        render();
      }, onError);
    }

    // Module scripts don't expose top-level functions on window, but the
    // HTML uses inline onclick="..." attributes for these - so they need
    // to be attached explicitly.
    window.toggleConfig = toggleConfig;
    window.toggleArchived = toggleArchived;
    window.toggleAddForm = toggleAddForm;
    window.submitIdea = submitIdea;

    signInAnonymously(auth).then(boot).catch(onError);
  </script>
</body>
</html>
